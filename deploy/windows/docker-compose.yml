version: '3.8'

services:
  auto-qa:
    image: auto-qa:latest
    container_name: auto-qa
    network_mode: "host"
    
    volumes:
      # 결과물
      - ./report:/app/report
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
      
      # APK 파일
      - ./apks:/app/apks
    
    environment:
      - ADB_DEVICE=127.0.0.1:5555
      - APK_PATH=/app/apks/cooptd.apk
      - MCP_SERVER_URL=http://localhost:37772
    
    env_file:
      - .env
    
    restart: "no"