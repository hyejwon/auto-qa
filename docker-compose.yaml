version: '3.8'

services:
  qa-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-auto:latest
    container_name: qa-app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - ANDROID_ADB_SERVER_ADDRESS=host.docker.internal
      - ANDROID_ADB_SERVER_PORT=5037

    volumes:
      - ./testcases:/app/testcases
      - ./test_results:/app/test_results
      - ./screenshots:/app/screenshots
      - ./screenshots_debug:/app/screenshots_debug
      - ./recordings:/app/recordings
      - ./apks:/app/apks
      - ./templates:/app/templates
      - ./common_tap_cache.db:/app/common_tap_cache.db
      - ./element_cache.db:/app/element_cache.db
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./credentials.json}:/app/credentials.json:ro

    env_file:
      - .env

    ports:
      - "7860:7860"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
