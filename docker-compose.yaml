services:
  orchestrator:
    # IMAGE_TAG: prod=latest, dev=dev — 배포 워크플로우가 주입
    image: qa-auto-orchestrator:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-qa-orchestrator}
    ports:
      # HOST_PORT: 서버 외부 노출 포트 (prod=8000, dev=8001). 컨테이너 내부는 항상 8000
      # (.env의 ORCHESTRATOR_PORT는 컨테이너 내부 바인딩용이므로 8000 유지)
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./templates:/app/templates
      - ./pipelines:/app/pipelines
      - ./test_results:/app/test_results
      - ./recordings:/app/recordings
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
