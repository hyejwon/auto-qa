title: 이지스 인게임 D 전투 시작 전 이지스 소환·배치 검증
description: >
  전투를 시작하기 전 준비 단계에서 이지스를 반복 소환해 궤도에 배치하고, 배치·합성·크레딧
  소비가 규칙대로 동작하는지 검증한다. 웨이브를 끝까지 진행하지 않으므로 짧고 안정적이다.
  실기기 확인 사실(2026-07-27~28):
  - 준비 단계에서만 소환할 수 있다. 전투가 시작되면 하단이 킬 스코어 보드로 바뀐다.
  - 시작 크레딧 45, 첫 소환 비용 5. 소환할수록 비용이 오른다(5 → 15 → 35).
  - 크레딧이 다음 소환 비용보다 적으면 버튼의 비용 숫자가 빨간색이 되고 소환이 차단된다.
  - 궤도 슬롯은 12칸이고, 배치된 이지스마다 우측 하단에 티어 숫자 배지가 붙는다.
  - ⚠️ 반복 소환만으로는 합성이 일어나지 않는다. 같은 종류가 여러 기 있어도 전부 티어 1로
    남는다(2026-07-28 실기기: 미사일 4·전기 3·포탑 3이 모두 티어 1). 합성은 **같은 종류
    두 기를 드래그로 겹쳐야** 일어나며, 그때 대상이 티어 2가 되고 드래그한 쪽은 사라지고
    크레딧은 소모되지 않는다. 드래그 검증은 별도 액션이 필요해 이 템플릿에서는 다루지 않는다.
  - ⚠️ 소환이 멈추는 이유는 크레딧 부족이 아니라 **궤도 12칸 만석**이다. 크레딧이 835 남아
    있어도 슬롯이 차면 더 배치되지 않는다.
  기본 크레딧 45로는 5기까지만 배치되므로, 소환 규칙을 검증한 뒤 `ingame.currency.give`로
  크레딧을 지급해 궤도가 가득 찰 때까지 반복 소환한다. 치트는 사전 상태를 만드는 데만 쓰고
  판정은 전부 화면으로 한다.
package: com.supermagic.aos.aegisdefense
steps:
- action: close_app
  target: com.supermagic.aos.aegisdefense
  description: 이전 실행 상태를 완전히 끊기 위해 앱 종료
  timeout: 15
  retry: 2
  params:
    package: com.supermagic.aos.aegisdefense
- action: launch_app
  target: com.supermagic.aos.aegisdefense
  description: 이지스 디펜스 실행
  timeout: 30
  retry: 2
  params:
    package: com.supermagic.aos.aegisdefense
- action: wait
  description: AEGIS 스플래시 로딩 대기 (실기기 60~80초)
  timeout: 90
  retry: 1
  params:
    seconds: 60
# 부팅을 막는 팝업 3종 — 안 뜨는 게 정상이라 optional로 둔다
- action: find_and_tap
  target: 추가 데이터 다운로드 제목이 붙은 팝업 하단 오른쪽 검은색 다운로드 버튼
  description: 추가 데이터 다운로드 팝업이 뜨면 다운로드 진행
  timeout: 20
  retry: 1
  params:
    optional: true
    set_flag_on_pass: patch_download
    wait_seconds: 5
- action: wait
  description: (다운로드를 진행했을 때만) 패치 적용 후 재로딩 대기
  timeout: 120
  retry: 1
  params:
    run_if_flag: patch_download
    seconds: 75
- action: find_and_tap
  target: 이어하기 제목이 붙은 팝업 하단 왼쪽 회색 취소 버튼
  description: 이어하기 팝업이 뜨면 취소
  timeout: 15
  retry: 1
  params:
    optional: true
    wait_seconds: 3
- action: find_and_tap
  target: 화면 가운데 떠 있는 회색 팝업 상자 안에서 "확인"이라고 적힌 검은색 둥근 버튼 (팝업이 없거나 버튼 글자가 "전투"·"다음"이면 대상 아님)
  description: 결과·안내 팝업이 남아 있으면 닫기
  timeout: 15
  retry: 1
  params:
    optional: true
    wait_seconds: 3
- action: verify
  target: 아웃게임 스테이지 선택 화면 (씬 판정으로 확인)
  description: 아웃게임 진입 확인
  timeout: 60
  retry: 5
  params:
    scene: outgame
- action: call_cheat
  target: common.stage.start
  description: 1-1 스테이지를 웨이브 1부터 시작 — 시작 크레딧 45의 준비 화면 확보
  timeout: 20
  retry: 2
  params:
    args:
      chapterId: 1
      stageInChapter: 1
    wait_seconds: 8
- action: verify
  target: 상단에 Wave 1 진행 표시가 있고 하단에 이지스 소환 버튼과 검은색 둥근 전투 시작 버튼이 보이는 인게임 준비 화면
  description: 인게임 준비 화면 진입 확인
  timeout: 40
  retry: 4
  params: {}
# ── 1) 기본 소환 규칙: 표기 비용만큼 정확히 차감되고 궤도에 배치되는가 ──────────
- action: read_screen
  description: 소환 전 크레딧과 표기 비용 기록
  timeout: 60
  retry: 3
  params:
    items:
    - name: 크레딧
      description: 화면 하단 오른쪽 ⓒ 아이콘 옆에 표시된 보유 크레딧 숫자
      save_as: credit_0
    - name: 소환 비용
      description: 화면 하단 가운데 이지스 소환 버튼 안에 ⓒ 아이콘과 함께 적힌 소환 비용 숫자
      save_as: cost_0
- action: find_and_tap
  target: 화면 하단 가운데 이지스 소환 버튼
  description: 이지스 소환 1회차
  timeout: 20
  retry: 2
  params:
    wait_seconds: 2
- action: verify
  target: 중앙 행성 주위 궤도 슬롯 중 한 칸에 색이 채워진 원형 이지스 아이콘과 우측 하단 티어 숫자 배지가 표시된 상태
  description: 소환한 이지스가 궤도 슬롯에 배치되고 티어 배지가 붙는지 확인
  timeout: 20
  retry: 3
  params: {}
- action: read_text
  target: 화면 하단 오른쪽 ⓒ 아이콘 옆에 표시된 보유 크레딧 숫자
  description: 버튼에 표기된 비용(cost_0)만큼 정확히 차감됐는지 검증
  timeout: 30
  retry: 3
  params:
    compare_with: credit_0
    expect_delta_from: cost_0
    delta_sign: -1
    save_as: credit_1
# ── 2) 크레딧을 지급해 반복 소환·합성까지 확인 ──────────────────────────
# 기본 45로는 5기에서 크레딧이 마르고 비용이 15로 올라 합성을 보기 어렵다.
- action: call_cheat
  target: ingame.currency.give
  description: 반복 소환·합성을 볼 수 있도록 크레딧 1000 지급
  timeout: 20
  retry: 2
  params:
    args:
      currencyType: Credit
      amount: 1000
    wait_seconds: 2
- action: read_text
  target: 화면 하단 오른쪽 ⓒ 아이콘 옆에 표시된 보유 크레딧 숫자
  description: 지급한 만큼 정확히 증가했는지 검증
  timeout: 30
  retry: 3
  params:
    compare_with: credit_1
    expect_delta: 1000
    save_as: credit_funded
# 크레딧이 마를 때까지 반복 소환한다. 비용이 계속 오르므로 횟수가 가변이라 repeat_until을 쓴다.
# ⚠️ 종료 조건을 "크레딧 부족(비용 빨간색)"으로 잡으면 안 된다 — 크레딧이 남아도 궤도가
# 차면 소환이 멈추기 때문에 조건이 영영 성립하지 않는다(2026-07-28: 42회 소환 후에도
# 크레딧 835·비용 35로 부족하지 않아 루프가 타임아웃). 궤도 만석을 종료 조건으로 쓴다.
- action: repeat_until
  description: 궤도가 가득 찰 때까지 이지스를 반복 소환
  timeout: 300
  retry: 1
  params:
    until_visible: 중앙 행성 주위 궤도 슬롯이 색이 채워진 원형 이지스 아이콘으로 빈 칸 없이 가득 찬 상태 (안쪽·바깥쪽 궤도 모두 채워짐)
    max_iterations: 14
    timeout_seconds: 260
    steps:
    - action: find_and_tap
      target: 화면 하단 가운데 이지스 소환 버튼
      description: 이지스 소환
      timeout: 12
      retry: 1
      params:
        wait_seconds: 1
    - action: find_and_tap
      target: 화면 하단 가운데 이지스 소환 버튼
      description: 이지스 소환
      timeout: 12
      retry: 1
      params:
        wait_seconds: 1
    - action: find_and_tap
      target: 화면 하단 가운데 이지스 소환 버튼
      description: 이지스 소환
      timeout: 12
      retry: 1
      params:
        wait_seconds: 1
# ── 3) 배치·합성 결과 판정 ────────────────────────────────────────
- action: verify
  target: 중앙 행성 주위 궤도 슬롯에 색이 채워진 원형 이지스 아이콘이 여섯 기 이상 배치되어 궤도를 넓게 채우고 있는 상태
  description: 반복 소환으로 궤도가 여러 기로 채워졌는지 확인
  timeout: 30
  retry: 3
  params: {}
- action: read_screen
  description: 배치 결과 판독 — 이지스 종류와 합성(티어 상승) 여부
  timeout: 60
  retry: 3
  params:
    items:
    - name: 배치된 이지스 종류 수
      description: 중앙 궤도에 배치된 이지스 아이콘들이 서로 다른 색·모양으로 몇 종류인지 세어 숫자만
    - name: 최고 티어 배지
      description: 궤도의 이지스 아이콘 우측 하단에 붙은 티어 숫자 배지들 중 가장 큰 값
      save_as: max_tier
    - name: 배치된 이지스 수
      description: 중앙 궤도에 배치된 색이 채워진 원형 이지스 아이콘의 총 개수를 숫자만
- action: read_text
  target: 화면 하단 오른쪽 ⓒ 아이콘 옆에 표시된 보유 크레딧 숫자
  description: 반복 소환으로 크레딧이 소비됐는지 검증
  timeout: 30
  retry: 3
  params:
    compare_with: credit_funded
    expect_decrease: true
- action: verify
  target: 화면 최하단 검은색 둥근 전투 시작 버튼이 밝게 활성화되어 있고 상단에는 Wave 1 진행 표시가 그대로인 준비 화면
  description: 소환을 마친 뒤에도 전투를 시작할 수 있는 준비 상태가 유지되는지 확인
  timeout: 30
  retry: 3
  params: {}
preconditions:
- 이지스 디펜스 디버그 빌드가 설치되어 있고 앱 내부 v2 치트 서버(37772)가 떠 있어야 한다
- 튜토리얼이 완료된 계정이어야 한다
expected_results:
- 이지스 소환 시 버튼 표기 비용만큼 크레딧이 정확히 차감된다
- 소환한 이지스가 궤도 슬롯에 티어 배지와 함께 배치된다
- ingame.currency.give로 지급한 크레딧이 정확히 반영된다
- 반복 소환으로 궤도 12칸이 가득 찬다
- 궤도가 차면 크레딧이 남아 있어도 더 이상 배치되지 않는다 (소환 한계는 크레딧이 아니라 슬롯)
- 소환을 마친 뒤에도 전투 시작 버튼이 활성 상태로 유지된다
