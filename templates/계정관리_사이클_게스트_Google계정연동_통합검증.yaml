title: 계정관리 사이클 - 게스트 계정 연동 팝업부터 기존/신규 Google 연동까지 통합 흐름
description: >
  계정관리_01~05를 하나의 연속된 사이클로 이어 붙인 통합 템플릿이다. 게스트 로그인 상태에서
  계정 연동 팝업의 플랫폼 버튼 노출을 확인한 뒤, 기존 데이터가 있는 Google 계정을 [기존] 선택
  (되돌릴 수 있는 분기)으로 연동해 PID 변경과 로그아웃 후 게스트 데이터 보존을 확인하고,
  이어서 같은 계정을 [현재] 선택으로 다시 연동 시도해 오입력 거부 → 정확한 문구 입력 성공
  (파괴적 분기, 게스트 데이터로 Google 계정 데이터를 덮어씀)까지 검증한다. [현재] 선택 성공
  이후에는 게스트의 로컬 계정 슬롯이 소진되어 로그아웃 후 재로그인 시 완전히 새로운 게스트가
  튜토리얼부터 시작하므로, 컨텐츠 해금 흐름 테스트에서 검증된 튜토리얼 스킵 절차로 전투 탭에
  다시 도달한 뒤 마지막으로 기존 데이터가 없는 새 Google 계정을 연동해 PID가 그대로 유지되는지
  확인하며 사이클을 마무리한다.
package: com.percent.aos.cooptd
required_tab: 전투
parameters:
- name: google_account_with_data
  label: 기존 데이터가 있는 Google 계정
  description: 이미 게임 데이터가 연결된 Google 계정 이메일 ([기존]/[현재] 분기 모두 이 계정을 사용한다)
  example: qa_google_01@111percent.net
  default: qa_google_01@111percent.net
- name: invalid_consent_text
  label: 잘못된 확인 문구
  description: 동의합니다와 일치하지 않아야 하는 문자열
  example: 동의하지않습니다
  default: 동의하지않습니다
- name: consent_text
  label: 계정 소실 확인 문구
  description: 계정 소실 알림 팝업이 요구하는 정확한 문자열
  example: 동의합니다
  default: 동의합니다
- name: google_account_without_data
  label: 기존 데이터가 없는 Google 계정
  description: 게임 데이터가 한 번도 연결되지 않은 Google 계정 이메일
  example: qa_new_google_account@111percent.net
  default: ''
steps:

# ── Phase 0: 게스트 계정 연동 팝업 플랫폼 버튼 검증 (참고: 계정관리_01) ──
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 게스트 계정의 햄버거 메뉴를 연다.
  timeout: 15
  retry: 3
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
    wait_seconds: 2
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 사이클 시작 시점의 게스트 PID를 저장한다.
  timeout: 15
  retry: 2
  params:
    save_as: guest_pid_initial
- action: find_and_tap
  target: 설정 팝업 하단 우측의 계정 연동 버튼
  description: 게스트 계정의 계정 연동 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 연동 팝업
- action: verify
  target: 계정 연동 팝업 내 Google 로그인 버튼
  description: Google 플랫폼 로그인 버튼 노출을 확인한다.
  timeout: 10
  retry: 2
- action: verify
  target: 계정 연동 팝업 내 Apple 로그인 버튼
  description: Apple 플랫폼 로그인 버튼 노출을 확인한다.
  timeout: 10
  retry: 2

# ── Phase 1: 기존 데이터가 있는 Google 계정 - [기존] 선택 (참고: 계정관리_02, 되돌릴 수 있는 분기) ──
- action: find_and_tap
  target: 계정 연동 팝업 내 Google 로그인 버튼
  description: 기존 데이터가 있는 Google 계정 로그인을 시작한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Google 계정 선택 화면 또는 약관 알림 팝업
    wait_seconds: 2
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  description: 최초 연동일 때만 약관에 동의한다.
  timeout: 10
  retry: 1
  params:
    optional: true
    expect_visible: Google 계정 선택 화면
- action: verify
  target: '{{google_account_with_data}}'
  description: 기존 데이터가 있는 Google 계정이 목록에 있는지 확인한다.
  timeout: 15
  retry: 2
- action: find_and_tap
  target: '{{google_account_with_data}}'
  description: 기존 데이터가 있는 Google 계정을 선택한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 기존 데이터 / 현재 데이터 선택 팝업
    wait_seconds: 3
- action: find_and_tap
  target: 기존 (연도-월-일) 라디오 옵션
  description: Google 계정에 저장된 기존 데이터 옵션을 선택한다 (체크만 되고 아직 연동은 확정되지 않는다).
  timeout: 15
  retry: 2
  params:
    expect_visible: 초록색 계정 연동 확정 버튼
- action: find_and_tap
  target: 초록색 계정 연동 확정 버튼 (기존/현재 데이터 선택 팝업 하단)
  description: 기존 데이터 선택을 실제로 확정한다. 라디오 선택만으로는 연동이 완료되지 않고 이 버튼을 눌러야 한다 — 우측 상단 햄버거 메뉴는 팝업이 떠 있어도 항상 보이므로 완료 신호로 쓸 수 없어, 팝업이 실제로 사라지는지로 확인한다.
  timeout: 20
  retry: 2
  params:
    expect_hidden: 기존 데이터 / 현재 데이터 선택 팝업
    wait_seconds: 5
- action: dismiss_popups
  description: 계정 전환 직후 뜰 수 있는 복귀 보상(캡틴의 초대 등) 팝업을 정리해 햄버거 메뉴가 실제로 눌리는 상태로 만든다. 팝업이 없으면 즉시 통과한다.
  timeout: 30
  retry: 1
  params:
    stop_when_visible: 팝업이나 딤 오버레이 없이 우측 상단 햄버거 메뉴 버튼이 눌리는 전투 로비
    max_count: 3
    timeout_seconds: 25
    initial_wait_seconds: 1
    quiet_seconds: 2
    poll_interval_seconds: 0.75
    rules:
    - target: 캡틴의 초대 팝업의 초록색 보상 받기! 버튼
      action: tap_center
    - target: 화면을 탭하여 열기 문구가 있는 편지 봉투
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 연동 후 PID 확인을 위해 햄버거 메뉴를 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 다시 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 기존 Google 데이터 PID로 변경됐는지 확인한다.
  timeout: 15
  retry: 2
  params:
    compare_with: guest_pid_initial
    expect_changed: true
- action: find_and_tap
  target: 초록색 '연결됨' 버튼 (설정 팝업 하단 우측)
  description: 계정 관리 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 버튼
- action: find_and_tap
  target: 로그아웃 버튼
  description: Google 계정 로그아웃 알림을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 알림 팝업
- action: find_and_tap
  target: 로그아웃 알림 팝업의 로그아웃 버튼
  description: 로그아웃하고 타이틀 화면으로 돌아간다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Guest login 버튼
    wait_seconds: 5
- action: find_and_tap
  target: Guest login 버튼
  description: 기존 게스트 데이터로 다시 로그인한다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 게스트 로그인 데이터 유실 안내 팝업
- action: find_and_tap
  target: 게스트 로그인 데이터 유실 안내 팝업의 예 버튼
  description: 게스트 로그인을 진행한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 우측 상단 햄버거 메뉴(☰) 버튼
    wait_seconds: 8
- action: dismiss_popups
  description: 복귀한 게스트에도 뜰 수 있는 복귀 보상(캡틴의 초대 등) 팝업을 정리해 햄버거 메뉴가 실제로 눌리는 상태로 만든다. 팝업이 없으면 즉시 통과한다.
  timeout: 30
  retry: 1
  params:
    stop_when_visible: 팝업이나 딤 오버레이 없이 우측 상단 햄버거 메뉴 버튼이 눌리는 전투 로비
    max_count: 3
    timeout_seconds: 25
    initial_wait_seconds: 1
    quiet_seconds: 2
    poll_interval_seconds: 0.75
    rules:
    - target: 캡틴의 초대 팝업의 초록색 보상 받기! 버튼
      action: tap_center
    - target: 화면을 탭하여 열기 문구가 있는 편지 봉투
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 복귀한 게스트 PID 확인을 위해 햄버거 메뉴를 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 기존 게스트 PID가 그대로 유지되는지 확인한다 ([기존] 선택 분기는 되돌릴 수 있어야 한다).
  timeout: 15
  retry: 2
  params:
    compare_with: guest_pid_initial
    expect_changed: false

# ── Phase 2: 같은 계정 - [현재] 선택, 오입력 거부 확인 (참고: 계정관리_03) ──
# 설정 팝업이 이미 열려 있으므로 바로 계정 연동 버튼부터 이어간다.
- action: find_and_tap
  target: 설정 팝업 하단 우측의 계정 연동 버튼
  description: 계정 연동 팝업을 다시 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 연동 팝업
- action: find_and_tap
  target: 계정 연동 팝업 내 Google 로그인 버튼
  description: 같은 기존 데이터 보유 Google 계정 로그인을 다시 시작한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Google 계정 선택 화면 또는 약관 알림 팝업
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  description: 약관 알림이 다시 뜨는 경우에만 동의한다.
  timeout: 10
  retry: 1
  params:
    optional: true
    expect_visible: Google 계정 선택 화면
- action: find_and_tap
  target: '{{google_account_with_data}}'
  description: 기존 데이터가 있는 Google 계정을 다시 선택한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 기존 데이터 / 현재 데이터 선택 팝업
    wait_seconds: 3
- action: find_and_tap
  target: 현재 데이터 버튼
  description: 현재 게스트 데이터를 Google 계정에 덮어쓰는 분기를 선택한다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 소실 알림 팝업
- action: verify
  target: 계정 소실 알림 팝업의 '동의합니다' 입력 안내 문구
  description: 데이터 소실 경고와 확인 문구 입력 요구를 확인한다.
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 계정 소실 알림 팝업의 확인 문구 입력란
  description: 확인 문구 입력란에 포커스를 둔다.
  timeout: 10
  retry: 2
  params:
    expect_visible: Android 키보드
- action: input_text
  target: 계정 소실 알림 팝업의 확인 문구 입력란
  description: 동의합니다와 다른 문구를 입력한다.
  timeout: 10
  retry: 1
  params:
    text: '{{invalid_consent_text}}'
- action: find_and_tap
  target: 계정 소실 알림 팝업의 계정 연동 버튼
  description: 잘못된 확인 문구로 계정 연동을 시도한다.
  timeout: 10
  retry: 2
  params:
    expect_visible: 입력 문구가 일치하지 않는다는 토스트 메시지
- action: verify
  target: 계정 소실 알림 팝업
  description: 실패 후에도 계정 소실 알림 팝업이 유지되는지 확인한다.
  timeout: 10
  retry: 2

# ── Phase 3: 같은 계정 - [현재] 선택, 정확한 문구로 성공 (참고: 계정관리_04, 파괴적·비가역 분기) ──
# 같은 계정 소실 알림 팝업이 열려 있는 상태에서 입력란을 정확한 문구로 다시 채운다.
- action: find_and_tap
  target: 계정 소실 알림 팝업의 확인 문구 입력란
  description: 확인 문구 입력란에 다시 포커스를 둔다.
  timeout: 10
  retry: 2
  params:
    expect_visible: Android 키보드
- action: input_text
  target: 계정 소실 알림 팝업의 확인 문구 입력란
  description: 정확한 계정 소실 확인 문구로 다시 입력한다.
  timeout: 10
  retry: 1
  params:
    text: '{{consent_text}}'
- action: find_and_tap
  target: 계정 소실 알림 팝업의 계정 연동 버튼
  description: 현재 게스트 데이터로 계정 연동을 확정한다. 우측 상단 햄버거 메뉴는 팝업이 떠 있어도 항상 보이는 요소라 완료 신호로 쓰지 않고, 팝업이 실제로 사라지는지로 확인한다.
  timeout: 20
  retry: 2
  params:
    expect_hidden: 계정 소실 알림 팝업
    wait_seconds: 5
- action: dismiss_popups
  description: 계정 전환 직후 뜰 수 있는 복귀 보상(캡틴의 초대 등) 팝업을 정리해 햄버거 메뉴가 실제로 눌리는 상태로 만든다. 팝업이 없으면 즉시 통과한다.
  timeout: 30
  retry: 1
  params:
    stop_when_visible: 팝업이나 딤 오버레이 없이 우측 상단 햄버거 메뉴 버튼이 눌리는 전투 로비
    max_count: 3
    timeout_seconds: 25
    initial_wait_seconds: 1
    quiet_seconds: 2
    poll_interval_seconds: 0.75
    rules:
    - target: 캡틴의 초대 팝업의 초록색 보상 받기! 버튼
      action: tap_center
    - target: 화면을 탭하여 열기 문구가 있는 편지 봉투
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 연동 후 PID 확인을 위해 햄버거 메뉴를 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 연동된 Google 계정이 기존 게스트 PID를 그대로 사용하는지 확인한다.
  timeout: 15
  retry: 2
  params:
    compare_with: guest_pid_initial
    expect_changed: false
- action: find_and_tap
  target: 초록색 '연결됨' 버튼 (설정 팝업 하단 우측)
  description: 계정 관리 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 버튼
- action: find_and_tap
  target: 로그아웃 버튼
  description: 로그아웃 알림 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 알림 팝업
- action: find_and_tap
  target: 로그아웃 알림 팝업의 로그아웃 버튼
  description: 로그아웃하고 타이틀 화면으로 돌아간다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Guest login 버튼
    wait_seconds: 5
- action: find_and_tap
  target: Guest login 버튼
  description: 새로운 Guest 로그인을 시작한다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 게스트 로그인 데이터 유실 안내 팝업
- action: find_and_tap
  target: 게스트 로그인 데이터 유실 안내 팝업의 예 버튼
  description: Guest 로그인을 진행한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 튜토리얼 화면 또는 건너뛰기 버튼
    wait_seconds: 8
- action: verify
  target: 튜토리얼 시작 화면 또는 튜토리얼 건너뛰기 버튼
  description: 이전 게스트 데이터가 사라지고 튜토리얼부터 시작하는지 확인한다 ([현재] 선택 분기는 되돌릴 수 없다).
  timeout: 20
  retry: 3

# ── Bridge: 튜토리얼 스킵으로 전투 탭 재도달 (참고: 협타디 튜토리얼 스킵 템플릿) ──
# [현재] 선택 성공으로 게스트 로컬 슬롯이 소진되어 방금 만들어진 게스트는 완전 신규 상태다.
# 완전 신규 계정은 1차 스킵 API 호출만으로 전투 탭까지 못 가고 웨이브 0 전투 튜토리얼
# 화면에서 멈출 수 있으므로(2026-07-23 실기기 확인), 2차 스킵까지 대비한다.
- action: skip_tutorial
  target: com.percent.aos.cooptd
  description: 방금 생성된 신규 게스트의 튜토리얼 스킵 API 호출 1차.
  timeout: 20
  retry: 2
  params:
    set_flag_on_pass: tutorial_skip_1
- action: close_app
  target: com.percent.aos.cooptd
  description: 스킵 반영을 위한 재부팅용 앱 종료 1차.
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
- action: launch_app
  target: com.percent.aos.cooptd
  description: 앱 재실행 1차.
  timeout: 20
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
- action: find_and_tap
  target: 건너뛰기 버튼
  description: (나올 경우) 튜토리얼 건너뛰기 버튼 클릭 1차.
  timeout: 10
  retry: 2
  params:
    optional: true
    expect_visible: 정말로 건너뛰시겠습니까 팝업
- action: find_and_tap
  target: 예 버튼
  description: (나올 경우) 건너뛰기 확인 팝업에서 예 클릭 1차.
  timeout: 10
  retry: 2
  params:
    optional: true
    expect_hidden: 정말로 건너뛰시겠습니까 팝업
    wait_seconds: 1
- action: dismiss_popups
  description: VIP 광고·컨텐츠 해금 안내가 남아 있으면 닫고 깨끗한 전투 로비(우측 상단 햄버거 메뉴가 밝게 보이는 상태)인지 확인한다. 완전 신규 계정이라 웨이브 0 화면에서 멈추면 optional 처리해 2차 스킵으로 넘어간다.
  timeout: 120
  retry: 1
  params:
    optional: true
    set_flag_on_pass: tutorial_ready
    stop_when_visible: 팝업과 딤 오버레이가 없고 화면 중앙 SOLO 플레이 버튼과 우측 상단 햄버거 메뉴 버튼이 밝게 보이는 전투 로비
    max_count: 6
    timeout_seconds: 110
    initial_wait_seconds: 2
    quiet_seconds: 4
    poll_interval_seconds: 0.75
    rules:
    - target: VIP 상점 화면 좌측 하단의 흰색 왼쪽 화살표 뒤로가기 버튼
      action: tap
    - target: 루키의 도전 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 마물 육성 입문 가이드 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
- action: skip_tutorial
  target: com.percent.aos.cooptd
  description: (1차로 전투 탭에 도달 못 했을 때만) 웨이브 0 전투 튜토리얼 관문용 스킵 API 재호출 2차.
  timeout: 20
  retry: 2
  params:
    skip_if_flag: tutorial_ready
    set_flag_on_pass: tutorial_skip_2
- action: close_app
  target: com.percent.aos.cooptd
  description: (2차 스킵을 진행했을 때만) 재부팅을 위한 앱 종료 2차.
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
- action: launch_app
  target: com.percent.aos.cooptd
  description: (2차 스킵을 진행했을 때만) 앱 재실행 2차.
  timeout: 20
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
- action: find_and_tap
  target: 건너뛰기 버튼
  description: (나올 경우) 튜토리얼 건너뛰기 버튼 클릭 2차.
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
    optional: true
    expect_visible: 정말로 건너뛰시겠습니까 팝업
- action: find_and_tap
  target: 예 버튼
  description: (나올 경우) 건너뛰기 확인 팝업에서 예 클릭 2차.
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
    optional: true
    expect_hidden: 정말로 건너뛰시겠습니까 팝업
    wait_seconds: 1
- action: dismiss_popups
  description: 남은 컨텐츠 해금 안내를 모두 닫고 깨끗한 전투 로비인지 최종 확인한다.
  timeout: 150
  retry: 1
  params:
    skip_if_flag: tutorial_ready
    set_flag_on_pass: tutorial_ready
    stop_when_visible: 팝업과 딤 오버레이가 없고 화면 중앙 SOLO 플레이 버튼과 우측 상단 햄버거 메뉴 버튼이 밝게 보이는 전투 로비
    max_count: 6
    timeout_seconds: 140
    initial_wait_seconds: 2
    quiet_seconds: 4
    poll_interval_seconds: 0.75
    rules:
    - target: VIP 상점 화면 좌측 하단의 흰색 왼쪽 화살표 뒤로가기 버튼
      action: tap
    - target: 루키의 도전 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 마물 육성 입문 가이드 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center

# ── Phase 4: 신규(또는 재사용) Google 계정 연동 — 계정 상태 자동 분기 (참고: 계정관리_05, 계정관리_12의 상태 자동 감지 패턴) ──
# google_account_without_data가 Phase 1~3에서 쓴 google_account_with_data와 같은 계정으로
# 지정된 경우, 이 시점의 계정은 더 이상 '데이터 없음' 상태가 아니라 기존/현재 선택 팝업이
# 다시 뜬다. 팝업 등장 여부를 미리 단정하지 않고, 실제 화면을 보고 자동으로 분기한다.
# 팝업이 뜨면 파괴적인 [현재] 대신 되돌릴 수 있는 [기존]을 선택해 계정 데이터를 보존한다.
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 새 게스트의 햄버거 메뉴를 연다.
  timeout: 15
  retry: 3
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 연동 전 새 게스트 PID를 저장한다.
  timeout: 15
  retry: 2
  params:
    save_as: guest_pid_new
- action: find_and_tap
  target: 설정 팝업 하단 우측의 계정 연동 버튼
  description: 계정 연동 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 연동 팝업
- action: find_and_tap
  target: 계정 연동 팝업 내 Google 로그인 버튼
  description: Google 계정 로그인을 시작한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Google 계정 선택 화면 또는 약관 알림 팝업
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  description: 최초 연동일 때만 약관에 동의한다.
  timeout: 10
  retry: 1
  params:
    optional: true
    expect_visible: Google 계정 선택 화면
- action: verify
  target: '{{google_account_without_data}}'
  description: 지정한 Google 계정이 목록에 있는지 확인한다.
  timeout: 15
  retry: 2
- action: find_and_tap
  target: '{{google_account_without_data}}'
  description: 지정한 Google 계정을 선택해 연동을 시도한다. 데이터가 없으면 바로 연동되고, 이미 데이터가 있으면(예 — 이 사이클 안에서 재사용된 계정) 선택 팝업이 뜬다.
  timeout: 25
  retry: 2
  params:
    expect_visible: 우측 상단 햄버거 메뉴(☰) 버튼 또는 기존 데이터 / 현재 데이터 선택 팝업
    wait_seconds: 5
- action: find_and_tap
  target: 기존 (연도-월-일) 라디오 옵션
  description: (선택 팝업이 뜬 경우에만) 계정에 이미 데이터가 있는 케이스 — 되돌릴 수 있는 [기존]을 라디오로 선택한다. 팝업 자체가 안 뜬 경우(진짜 신규 계정)에는 이 대상이 화면에 없으므로 자연스럽게 건너뛴다. 우측 상단 햄버거 메뉴는 팝업 유무와 무관하게 항상 보이는 요소라 분기 판단에 쓸 수 없어 사용하지 않는다.
  timeout: 15
  retry: 1
  params:
    optional: true
    expect_visible: 초록색 계정 연동 확정 버튼
    set_flag_on_pass: phase4_account_had_existing_data
- action: find_and_tap
  target: 초록색 계정 연동 확정 버튼 (기존/현재 데이터 선택 팝업 하단)
  description: (계정 재사용 케이스에서만) 기존 데이터 선택을 실제로 확정한다. 라디오 선택만으로는 연동이 완료되지 않는다.
  timeout: 20
  retry: 2
  params:
    run_if_flag: phase4_account_had_existing_data
    expect_hidden: 기존 데이터 / 현재 데이터 선택 팝업
    wait_seconds: 5
- action: dismiss_popups
  description: 계정 전환 직후 뜰 수 있는 복귀 보상(캡틴의 초대 등) 팝업을 정리해 햄버거 메뉴가 실제로 눌리는 상태로 만든다. 팝업이 없으면 즉시 통과한다.
  timeout: 30
  retry: 1
  params:
    stop_when_visible: 팝업이나 딤 오버레이 없이 우측 상단 햄버거 메뉴 버튼이 눌리는 전투 로비
    max_count: 3
    timeout_seconds: 25
    initial_wait_seconds: 1
    quiet_seconds: 2
    poll_interval_seconds: 0.75
    rules:
    - target: 캡틴의 초대 팝업의 초록색 보상 받기! 버튼
      action: tap_center
    - target: 화면을 탭하여 열기 문구가 있는 편지 봉투
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 연동 후 PID 확인을 위해 햄버거 메뉴를 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: (진짜 신규 계정 케이스) 팝업 없이 바로 연동됐으면 PID가 새 게스트 PID와 동일해야 한다.
  timeout: 15
  retry: 2
  params:
    skip_if_flag: phase4_account_had_existing_data
    compare_with: guest_pid_new
    expect_changed: false
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: (계정 재사용 케이스) [기존] 선택으로 그 계정에 저장된 기존 PID로 전환됐으면 새 게스트 PID와 달라야 한다.
  timeout: 15
  retry: 2
  params:
    run_if_flag: phase4_account_had_existing_data
    compare_with: guest_pid_new
    expect_changed: true

preconditions:
- Guest 로그인이 완료되어 전투 탭을 열 수 있는 상태여야 한다.
- google_account_with_data에는 기존 게임 데이터가 연결되어 있어야 한다. 사이클 중 [현재] 선택 단계(Phase 3)에서 이 계정의 기존 데이터가 게스트 데이터로 완전히 덮어써지는 파괴적 테스트이므로, 재실행 전에 해당 계정을 초기화해야 한다.
- google_account_without_data는 원칙적으로 기존 게임 데이터가 없는 신규 Google 계정이어야 한다. google_account_with_data와 같은 계정을 지정해도 Phase 4가 계정 상태를 자동 감지해 [기존] 선택으로 안전하게 처리하지만, 이 경우 '완전 신규 계정 연동' 시나리오 자체는 검증되지 않는다.
- 사이클 전체가 성공적으로 끝나면 최초 게스트 데이터, google_account_with_data의 기존 데이터, Phase 3~4 사이에 생성된 임시 게스트 데이터가 모두 소모/변경되는 비가역적 흐름이다. 반복 실행 전 계정 상태 초기화가 필요하다.
expected_results:
- Phase 0: 계정 연동 팝업에 Google/Apple 로그인 버튼이 모두 노출되어야 한다.
- "Phase 1: [기존] 선택 후 PID가 Google 계정의 기존 PID로 변경되고, 로그아웃 후 Guest 재로그인 시 최초 게스트 PID가 그대로 복원되어야 한다."
- "Phase 2: [현재] 선택 후 잘못된 확인 문구 입력 시 불일치 토스트와 함께 연동이 거부되고 팝업이 유지되어야 한다."
- "Phase 3: 정확한 확인 문구 입력 시 연동에 성공하고 PID는 연동 전 게스트 PID와 같아야 하며, 이후 Guest 재로그인 시 이전 게스트 데이터 없이 튜토리얼부터 시작해야 한다."
- Bridge: 신규 게스트가 튜토리얼을 스킵하고 우측 상단 햄버거 메뉴가 보이는 전투 탭에 도달해야 한다.
- "Phase 4 (계정 상태 자동 분기): 지정한 계정에 데이터가 없으면 선택 팝업 없이 바로 연동되고 PID는 연동 전 새 게스트 PID와 같아야 한다. 이미 데이터가 있는 계정이면(예 — google_account_without_data가 google_account_with_data와 동일할 때) 선택 팝업이 뜨고, [기존] 자동 선택으로 그 계정의 기존 PID로 전환되어 새 게스트 PID와 달라야 한다."
