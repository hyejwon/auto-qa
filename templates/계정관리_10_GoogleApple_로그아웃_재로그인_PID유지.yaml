title: 계정관리 10 - Google/Apple 로그아웃 재로그인 PID 유지
description: Google 또는 Apple 계정에서 로그아웃한 뒤 같은 플랫폼 계정으로 재로그인해 PID가 유지되는지 확인한다.
package: com.percent.aos.cooptd
required_tab: 전투
parameters:
- name: platform_login_button
  label: 플랫폼 로그인 버튼
  description: Google 로그인 버튼 또는 Apple 로그인 버튼
  example: Google 로그인 버튼
  default: Google 로그인 버튼
- name: platform_account
  label: 재로그인할 플랫폼 계정
  description: 계정 선택 화면에 표시되는 Google 이메일 또는 Apple 계정 식별자
  example: qa_google_01@111percent.net
  default: qa_google_01@111percent.net
steps:
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 햄버거 메뉴를 연다.
  timeout: 15
  retry: 3
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 로그아웃 전 PID를 저장한다.
  timeout: 15
  retry: 2
  params:
    save_as: linked_pid_before
- action: find_and_tap
  target: 초록색 '연결됨' 버튼 (설정 팝업 하단 우측)
  description: 계정 관리 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 버튼
- action: find_and_tap
  target: 로그아웃 버튼
  description: 로그아웃 알림 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 알림 팝업
- action: find_and_tap
  target: 로그아웃 알림 팝업의 로그아웃 버튼
  description: 로그아웃하고 타이틀 화면으로 돌아간다.
  timeout: 20
  retry: 2
  params:
    expect_visible: '{{platform_login_button}}'
    wait_seconds: 5
- action: find_and_tap
  target: '{{platform_login_button}}'
  description: 같은 플랫폼으로 재로그인을 시작한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 플랫폼 계정 선택 화면 또는 약관 알림 팝업
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  description: 필요할 때만 약관에 동의한다.
  timeout: 10
  retry: 1
  params:
    optional: true
    expect_visible: 플랫폼 계정 선택 화면
- action: verify
  target: '{{platform_account}}'
  description: 재로그인할 플랫폼 계정을 확인한다.
  timeout: 15
  retry: 2
- action: find_and_tap
  target: '{{platform_account}}'
  description: 로그아웃 전과 같은 플랫폼 계정으로 로그인한다.
  timeout: 25
  retry: 2
  params:
    expect_visible: 우측 상단 햄버거 메뉴(☰) 버튼
    wait_seconds: 7
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 재로그인 PID 확인을 위해 햄버거 메뉴를 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 같은 계정 재로그인 후 PID가 유지되는지 확인한다.
  timeout: 15
  retry: 2
  params:
    compare_with: linked_pid_before
    expect_changed: false
preconditions:
- Google 또는 Apple 계정으로 로그인되어 있어야 한다.
- platform_login_button과 platform_account를 실제 테스트 계정에 맞게 입력해야 한다.
expected_results:
- 로그아웃 시 타이틀 화면으로 돌아가야 한다.
- 같은 플랫폼 계정으로 재로그인한 후 PID가 로그아웃 전과 같아야 한다.
