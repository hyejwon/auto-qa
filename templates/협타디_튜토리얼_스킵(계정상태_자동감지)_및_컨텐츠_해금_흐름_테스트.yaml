title: 협타디 튜토리얼 스킵(계정 상태 자동 감지) 및 컨텐츠 해금 흐름 테스트
description: >
  로그인 후 화면을 보고 계정 상태를 자동 판별한다 — 전투 탭이 바로 보이면 이미 튜토리얼을
  끝낸 계정이므로 skip_tutorial API 호출/앱 재시작/건너뛰기 버튼 탭/컨텐츠 해금 팝업 정리까지
  전부 건너뛴다. 건너뛰기 버튼이 보이면 튜토리얼 미완료 계정이므로 기존대로 스킵 API 호출 →
  앱 재시작 → 건너뛰기 확인 → 컨텐츠 해금 팝업 정리를 그대로 진행한다.
  ⚠️ 완전 신규(웨이브 0을 한 번도 안 깬) 계정은 1차 스킵 API 호출로 튜토리얼 대사만 넘어가고
  그 뒤 실제 웨이브 0 전투 튜토리얼 화면에서 멈춘다(2026-07-23 실기기 확인) — 이 경우를 대비해
  스킵 API 호출/재부팅/건너뛰기 확인을 한 번 더 반복한다(2차). 이미 웨이브 0을 깬 계정은
  1차 이후 바로 컨텐츠 해금 팝업/전투 탭에 도달하므로 2차는 자동으로 건너뛴다.
package: com.percent.aos.cooptd
steps:
# 로그인이 끝나기 전에 skip_tutorial API를 호출하면 앱이 바로 재부팅되어 버린다
# (2026-07-23 확인) — 로그인 직후 화면이 안정될 때까지 먼저 확인하고 넘어간다.
# 로그인 후 화면은 계정 상태에 따라 둘 중 하나: 전투 탭(이미 튜토리얼 완료) 또는
# 건너뛰기 버튼(튜토리얼 미완료, 진행 필요) — 어느 쪽이든 로그인이 끝났다는 뜻이다.
- action: verify
  target: 로그인 완료 후 화면 — 하단 네비게이션 전투 탭(이미 튜토리얼 완료된 계정) 또는 튜토리얼 건너뛰기 버튼(튜토리얼 진행해야 하는 계정) 중 하나가 안정적으로 보이는 상태
  params: {}
  description: 로그인 완료 확인 (skip_tutorial API를 로그인 도중 호출하면 앱이 재부팅되므로 먼저 안정화 대기)
  timeout: 30
  retry: 3
- action: skip_tutorial
  target: com.percent.aos.cooptd
  description: (계정이 아직 튜토리얼을 안 끝냈을 때만) 튜토리얼 스킵 API 호출 1차 — 전투 탭이 이미 보이면 건너뜀
  timeout: 20
  retry: 2
  params:
    skip_if_visible: 하단 네비게이션 전투 탭
    set_flag_on_pass: tutorial_skip_1
- action: close_app
  target: com.percent.aos.cooptd
  description: (튜토리얼 스킵을 진행했을 때만) 재부팅을 위한 앱 종료 1차 — 전투 탭이 이미 보이면 건너뜀
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
- action: launch_app
  target: com.percent.aos.cooptd
  description: (튜토리얼 스킵을 진행했을 때만) 앱 재실행 1차 — 전투 탭이 이미 보이면 건너뜀
  timeout: 20
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
- action: find_and_tap
  target: 건너뛰기 버튼
  description: (나올 경우) 튜토리얼 건너뛰기 버튼 클릭 1차 — 이미 스킵된 계정이면 이 버튼/팝업 자체가 안 뜬다
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
    optional: true
    expect_visible: 정말로 건너뛰시겠습니까 팝업
- action: find_and_tap
  target: 예 버튼
  description: (나올 경우) 건너뛰기 확인 팝업에서 예 클릭 1차
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
    optional: true
    expect_hidden: 정말로 건너뛰시겠습니까 팝업
    wait_seconds: 1
# ⚠️ 완전 신규 계정(웨이브 0을 한 번도 안 깬 계정)은 위 1차 스킵으로 튜토리얼 "대사"만
# 넘어가고, 실제 웨이브 0 전투 튜토리얼 화면(가이드 알콩이가 마물 배치를 안내하는 실제
# 플레이 화면)에서 멈춘다 — 팝업이 아니라 스킵 API가 아직 못 넘은 다음 튜토리얼 관문이라
# dismiss_popups로는 처리 불가(2026-07-23 실기기에서 0개 처리 후 타임아웃 확인). 이 경우
# skip_tutorial API를 한 번 더 호출하고 재부팅하면 전투 탭까지 정상적으로 넘어간다.
# ⚠️ 컨텐츠 해금 팝업은 VIP 광고 → 루키의 도전 → 마물 육성 입문 가이드 →
# 여름바다 바캉스 순으로 연속 노출될 수 있다. 팝업 뒤의 전투 탭과 햄버거 버튼도
# Vision에 잡히므로 이 둘을 skip 조건으로 사용하면 팝업이 남은 채 완료되는 문제가 있다.
# 각 팝업을 우선 판정하고, 팝업/딤 오버레이가 없는 전투 로비가 4초 이상 유지될 때만
# 종료한다. 팝업 간 렌더링 지연과 Vision 응답 시간을 고려해 충분한 제한시간을 둔다.
- action: dismiss_popups
  description: (1차 스킵 후) VIP 광고와 루키의 도전·마물 육성 입문 가이드·여름바다 바캉스 해금 안내를 순서와 노출 여부에 맞춰 닫기. 완전 신규 계정의 웨이브 0 화면이면 optional 처리해 2차 스킵으로 넘어간다
  timeout: 120
  retry: 1
  params:
    run_if_flag: tutorial_skip_1
    optional: true
    set_flag_on_pass: tutorial_ready
    complete_after_target: 여름바다 바캉스 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
    stop_when_visible: 팝업과 딤 오버레이가 없고 화면 중앙 SOLO 플레이 버튼과 우측 상단 햄버거 메뉴 버튼이 밝게 보이는 전투 로비
    max_count: 6
    timeout_seconds: 110
    initial_wait_seconds: 2
    quiet_seconds: 4
    poll_interval_seconds: 0.75
    rules:
    - target: VIP 상점 화면 좌측 하단의 흰색 왼쪽 화살표 뒤로가기 버튼
      action: tap
    - target: 루키의 도전 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 마물 육성 입문 가이드 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 여름바다 바캉스 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
- action: skip_tutorial
  target: com.percent.aos.cooptd
  description: (1차 스킵으로 전투 탭에 도달 못 했을 때만) 튜토리얼 스킵 API 재호출 2차 — 완전 신규 계정의 웨이브 0 전투 튜토리얼 관문 처리용
  timeout: 20
  retry: 2
  params:
    run_if_flag: tutorial_skip_1
    skip_if_flag: tutorial_ready
    set_flag_on_pass: tutorial_skip_2
- action: close_app
  target: com.percent.aos.cooptd
  description: (2차 스킵을 진행했을 때만) 재부팅을 위한 앱 종료 2차
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
- action: launch_app
  target: com.percent.aos.cooptd
  description: (2차 스킵을 진행했을 때만) 앱 재실행 2차
  timeout: 20
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
- action: find_and_tap
  target: 건너뛰기 버튼
  description: (나올 경우) 튜토리얼 건너뛰기 버튼 클릭 2차 — 재부팅 후 컷신이 다시 뜨는 경우 대비
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
    optional: true
    expect_visible: 정말로 건너뛰시겠습니까 팝업
- action: find_and_tap
  target: 예 버튼
  description: (나올 경우) 건너뛰기 확인 팝업에서 예 클릭 2차
  timeout: 10
  retry: 2
  params:
    run_if_flag: tutorial_skip_2
    optional: true
    expect_hidden: 정말로 건너뛰시겠습니까 팝업
    wait_seconds: 1
- action: dismiss_popups
  description: VIP 광고와 루키의 도전·마물 육성 입문 가이드·여름바다 바캉스 해금 안내가 남아 있으면 모두 닫고 깨끗한 전투 로비인지 최종 확인
  timeout: 150
  retry: 1
  params:
    run_if_flag: tutorial_skip_1
    skip_if_flag: tutorial_ready
    set_flag_on_pass: tutorial_ready
    complete_after_target: 여름바다 바캉스 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
    stop_when_visible: 팝업과 딤 오버레이가 없고 화면 중앙 SOLO 플레이 버튼과 우측 상단 햄버거 메뉴 버튼이 밝게 보이는 전투 로비
    max_count: 6
    timeout_seconds: 140
    initial_wait_seconds: 2
    quiet_seconds: 4
    poll_interval_seconds: 0.75
    rules:
    - target: VIP 상점 화면 좌측 하단의 흰색 왼쪽 화살표 뒤로가기 버튼
      action: tap
    - target: 루키의 도전 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 마물 육성 입문 가이드 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 여름바다 바캉스 문구와 계속하려면 화면을 눌러주세요 문구가 함께 보이는 새로운 컨텐츠 해금 안내
      action: tap_center
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
preconditions: []
