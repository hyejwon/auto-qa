title: 다이아 구매 — 구매 인증 '요구 안함' 선택 검증
description: >
  상점 → 다이아 상품 결제 → 원탭 구매 → (조건부) 구매 인증 팝업에서 '요구 안함' 선택
  → 획득 화면 확인 → 보유 다이아 증가 확인.
  구매 인증 팝업은 나올 수도 안 나올 수도 있으므로 optional 스텝으로 처리한다.
package: ''
steps:
# 1) 메인 화면에서 상점으로 진입한다.
- action: find_and_tap
  target: 상점 버튼
  params:
    expect_visible: 상점 화면
    wait_seconds: 2
  description: 상점 진입
  timeout: 20
  retry: 2

# 2) 구매 전 보유 다이아 수량을 저장한다.
- action: read_text
  target: 보유 다이아 수량
  params:
    save_as: diamond_before
  description: 구매 전 다이아 수량 저장
  timeout: 10
  retry: 2

# 3) 상점은 일일상점→다이아 섹션 순의 스크롤 목록 — scroll_search로 내리며 상품을 찾아 탭.
- action: find_and_tap
  target: 다이아 4000 상품의 12000 KRW 가격 버튼
  params:
    scroll_search: true
    max_scrolls: 8
    expect_visible: Google Play 원탭 구매 버튼
    wait_seconds: 4
  description: 결제 아이템 선택 → Google Play 결제 시트 확인
  timeout: 30
  retry: 2

# 4) 원탭 구매 버튼 탭. 결제 완료 후 다음 화면은 두 갈래
#    (구매 인증 팝업 또는 바로 획득 화면)라서 여기서는 화면 검증을 하지 않는다.
- action: find_and_tap
  target: Google Play 원탭 구매 버튼
  params:
    wait_seconds: 8
  description: 원탭 구매 버튼 탭 및 결제 완료 대기
  timeout: 40
  retry: 2

# 4-1) [조건부] Google Play 결제 완료 확인 화면이 나오면 닫는다. 안 나오면 건너뜀.
- action: find_and_tap
  target: Google Play 결제 완료 화면의 확인 버튼
  params:
    optional: true
    wait_seconds: 2
  description: (나올 경우) Google Play 결제 완료 확인 닫기
  timeout: 12
  retry: 1

# 5) [조건부] 구매 인증 팝업이 나오면 '요구 안함' 선택 → '확인' 버튼까지 한 스텝(then_tap).
#    팝업이 안 나오면 스텝 전체를 건너뛴다 (optional).
#    '요구 안함' 선택 시 이후 결제에서 인증 없이 진행되므로 자동화 친화적 상태가 유지된다.
- action: find_and_tap
  target: 구매 인증 팝업의 '요구 안함' 옵션 버튼
  params:
    optional: true
    then_tap: 구매 인증 팝업의 '확인' 버튼
    wait_seconds: 3
  description: (나올 경우) 구매 인증 팝업에서 '요구 안함' 선택 후 확인
  timeout: 15
  retry: 1

# 6) 결제 후 획득 창이 나온다 — 팝업 개수는 계정의 최초 결제 여부에 따라 다르다.
#    일반 구매는 재화 획득 화면 1개뿐이지만, 이 계정의 실제 첫 결제라면 상점에 뜨는
#    '첫 결제 보너스! 초마신 검귀 100% 증정!' 배너 특전이 적용되어 재화 획득 → 초마신전용
#    유물 획득 → 검귀(초마신) 획득까지 팝업 3개가 연속으로 뜬다(2026-07-22 실기기 확인,
#    뉴비패키지_최초결제_검귀획득_검증.yaml 참고). find_and_tap 1회로 고정하면 최초 결제
#    계정에서 두 번째 팝업에 걸려 검증 실패하므로, 몇 개가 뜨든 상점 화면(다이아 수량
#    노출)이 보일 때까지 반복해서 닫는 dismiss_popups를 쓴다.
- action: dismiss_popups
  params:
    stop_when_visible: 보유 다이아 수량
    max_count: 4
    timeout_seconds: 40
    quiet_seconds: 1.5
    rules:
    - target: 아이템 획득 팝업의 안내 문구 ('터치하세요' 또는 '계속하려면 화면을 눌러주세요')
      action: tap
  description: 획득 팝업(들) 정리 후 상점 복귀 (최초 결제 계정이면 팝업 최대 3개)
  timeout: 45
  retry: 1

# 7) 아이템이 실제 지급되었는지 — 보유 다이아 수량이 '증가'했는지 숫자로 확인.
- action: read_text
  target: 보유 다이아 수량
  params:
    compare_with: diamond_before
    expect_increase: true
  description: 구매 후 다이아 수량 증가 확인 (재화 지급 검증)
  timeout: 10
  retry: 2

expected_results:
- 결제 아이템 선택 시 Google Play 원탭 구매 버튼이 노출되어야 한다.
- 결제 완료 후 구매 인증 팝업이 노출되면 '요구 안함' 선택이 정상 동작해야 한다 (미노출 시 건너뜀).
- 획득 화면이 노출되고(최초 결제 계정이면 최대 3개 연속) 정상적으로 닫혀야 한다.
- 구매 후 보유 다이아 수량이 구매 전과 달라져야 한다 (아이템 정상 지급).
- 테스트 결제 계정은 라이선스 테스터 또는 샌드박스 환경이어야 한다.
