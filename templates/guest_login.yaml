title: Guest 계정 연동
description: 설정 메뉴 → Google 계정 연동 → 약관 동의 → 계정 선택 → 로그인 완료
package: com.percent.aos.rollinghero
steps:
- action: find_and_tap
  target: 좌측 상단 햄버거 메뉴 버튼
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
    wait_seconds: 2
  description: 메뉴 버튼 클릭
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  params:
    expect_visible: 설정 팝업
  description: 설정 버튼 클릭
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 계정 연동 버튼
  params:
    expect_visible: 계정 연동 팝업
  description: 계정 연동 버튼 클릭
  timeout: 10
  retry: 2
- action: find_and_tap
  target: Google 로그인 버튼
  params:
    expect_visible: 약관 알림 팝업
  description: Google 로그인 버튼 클릭
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  params:
    expect_visible: 계정 선택 팝업
  description: 약관 동의 클릭
  timeout: 10
  retry: 2
- action: verify
  target: qa_google_02@111percnet.net
  params: {}
  description: 연동할 계정이 목록에 있는지 확인
  timeout: 10
  retry: 2
- action: find_and_tap
  target: qa_google_02@111percnet.net
  params:
    expect_hidden: 계정 연동 팝업
    expect_visible: 설정 팝업
    wait_seconds: 5
  description: 계정 선택 및 로그인 완료 확인
  timeout: 20
  retry: 2
expected_results:
- Google 계정 로그인이 정상 진행되어야 한다.
- 로그인 후 관련 팝업이 모두 닫혀야 한다.