title: 'guest 로그인 유실 팝업'
description: 'guest 로그인 버튼 → Guest 로그인(아니오→예) → 로그인 환료'
package: ''
steps:
- action: find_and_tap
  target: Guest login 버튼
  params:
    expect_visible: 게스트 로그인 데이터 유실 안내 팝업
  description: Guest login 버튼을 클릭한다.
  timeout: 15
  retry: 2
- action: find_and_tap
  target: 아니오 버튼
  params:
    expect_hidden: 게스트 로그인 데이터 유실 안내 팝업
  description: 데이터 유실 안내 팝업 내 아니오 버튼을 클릭한다.
  timeout: 10
  retry: 2
- action: find_and_tap
  target: Guest login 버튼
  params:
    expect_visible: 게스트 로그인 데이터 유실 안내 팝업
  description: 다시 Guest login 버튼을 클릭한다.
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 예 버튼
  params:
    expect_hidden: 게스트 로그인 데이터 유실 안내 팝업
    wait_seconds: 10
  description: 데이터 유실 안내 팝업 내 예 버튼을 클릭한다.
  timeout: 15
  retry: 2
expected_results:
- Guest 로그인 데이터 유실 안내 팝업에서 아니오 클릭 시 팝업이 닫혀야 한다.
