title: 다이아 4000 구매 검증
description: 상점 진입 → 다이아 상점 찾기 → 다이아 4000 상품 선택 → Google Play 테스트 결제 → 보유 다이아 변경 확인
package: ''
steps:
# 1) 메인 화면에서 상점으로 진입한다.
- action: find_and_tap
  target: 상점 버튼
  params:
    expect_visible: 상점 화면
    wait_seconds: 2
  description: 상점 진입
  timeout: 20
  retry: 2

# 2) 상점 화면에서 다이아 상점을 찾고 진입한다.
- action: find_and_tap
  target: 다이아 상점 탭
  params:
    expect_visible: 다이아 상품 목록
    wait_seconds: 2
  description: 다이아 상점 진입
  timeout: 20
  retry: 2

# 3) 구매 전 보유 다이아 수량을 저장한다.
- action: read_text
  target: 보유 다이아 수량
  params:
    save_as: diamond_before
  description: 구매 전 다이아 수량 저장
  timeout: 10
  retry: 2

# 4) 다이아 4000개(12000 KRW) 상품을 탭 → Google Play 결제 시트 노출.
- action: find_and_tap
  target: 다이아 4000 상품의 12000 KRW 가격 버튼
  params:
    scroll_search: true
    max_scrolls: 5
    expect_visible: Google Play 원탭 구매 버튼
    wait_seconds: 4
  description: 다이아 4000개(12000krw) 상품 선택 → 결제 시트 확인
  timeout: 30
  retry: 2

# 5) Google Play 시트에서 원탭 구매 → 테스트 결제 진행.
#    테스트 카드 '항상 승인' 환경 기준이며 실제 청구되지 않아야 한다.
- action: find_and_tap
  target: Google Play 원탭 구매 버튼
  params:
    expect_visible: 구매 완료
    wait_seconds: 8
  description: 원탭 구매 버튼 탭 및 결제 완료 대기
  timeout: 40
  retry: 2

# 6) 구매 완료 팝업 또는 확인 버튼을 닫고 다이아 상점으로 복귀한다.
- action: find_and_tap
  target: 구매 완료 확인 버튼
  params:
    expect_visible: 보유 다이아 수량
    wait_seconds: 3
  description: 구매 완료 확인 후 상점 화면 복귀
  timeout: 20
  retry: 2

# 7) 구매 후 보유 다이아 수량이 변경되었는지 확인한다.
- action: read_text
  target: 보유 다이아 수량
  params:
    compare_with: diamond_before
    expect_changed: true
  description: 구매 후 다이아 수량 변경 확인
  timeout: 10
  retry: 2

expected_results:
- 상점에서 다이아 상점으로 정상 진입해야 한다.
- 다이아 4000개 12000 KRW 상품 선택 시 Google Play 원탭 구매 버튼이 노출되어야 한다.
- 테스트 결제 완료 후 보유 다이아 수량이 구매 전과 달라져야 한다.
- 테스트 결제 계정은 라이선스 테스터 또는 샌드박스 환경이어야 한다.
