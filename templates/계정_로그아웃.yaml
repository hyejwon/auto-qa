title: 계정 로그아웃
description: ''
package: com.percent.aos.cooptd
# required_tab: 이 템플릿 실행 전 자동으로 '전투' 탭으로 이동하는 스텝이 맨 앞에 끼워진다
# (api_server.py의 _inject_required_tab_step) — 마물/유물/상점 등 다른 탭에 있다가
# 이 템플릿을 실행해 햄버거 메뉴를 못 찾고 실패하는 문제를 자동으로 방지한다.
required_tab: 전투
steps:
# ⚠️ 햄버거 메뉴 버튼은 화면 좌측이 아니라 우측 상단에 있다.
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 햄버거 메뉴 버튼 클릭
  timeout: 10
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
    wait_seconds: 2
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 버튼 클릭
  timeout: 10
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: verify
  target: 설정 팝업
  description: 설정 팝업 정상 출력 확인
  timeout: 10
  retry: 2
# ⚠️ 로그아웃도 계정 삭제와 동일하게 '연결됨' 버튼을 먼저 눌러야 로그아웃 옵션이 나온다
# (2026-07-23 사용자 확인) — 설정 팝업에 '로그아웃 버튼'이 바로 있지 않다.
- action: find_and_tap
  target: 초록색 '연결됨' 버튼 (계정 연동 상태 표시, 설정 팝업 하단 우측)
  description: 계정 연동 상태(연결됨) 버튼 클릭 — 로그아웃 옵션은 이 버튼을 눌러야 나온다
  timeout: 10
  retry: 2
  params:
    expect_visible: 로그아웃
- action: find_and_tap
  target: 로그아웃 버튼
  description: 로그아웃 버튼 클릭
  timeout: 10
  retry: 2
  params:
    wait_seconds: 2
# ⚠️ 로그아웃 확인 팝업이 뜰 수도, 바로 로그인 화면으로 갈 수도 있어 optional로 처리
# (정확한 동작은 미확인 — 다음 실행 결과 보고 필요 시 조정).
- action: find_and_tap
  target: 정말로 로그아웃 하시겠습니까 팝업의 확인/로그아웃 버튼
  description: (나올 경우) 로그아웃 확인 팝업에서 확인
  timeout: 10
  retry: 1
  params:
    optional: true
    expect_visible: Google 로그인 버튼
    wait_seconds: 3
- action: verify
  target: Google 로그인 버튼
  description: 로그아웃 후 로그인 화면 복귀 확인
  timeout: 15
  retry: 2
preconditions: []
