title: 계정관리 08 - 계정 삭제 성공 및 Guest 초기화
description: 정확한 확인 문구로 계정을 삭제하고 타이틀 복귀 및 새 Guest 로그인 시 튜토리얼 시작을 확인한다.
package: com.percent.aos.cooptd
required_tab: 전투
parameters:
- name: consent_text
  label: 계정 삭제 확인 문구
  description: 계정 삭제 알림 팝업이 요구하는 정확한 문자열
  example: 동의합니다
  default: 동의합니다
steps:
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 햄버거 메뉴를 연다.
  timeout: 15
  retry: 3
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: find_and_tap
  target: 설정 팝업 하단 우측의 계정 연동 또는 연결됨 버튼
  description: 계정 연동/관리 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 연동 팝업
- action: find_and_tap
  target: 계정 연동 팝업 내 계정 삭제 버튼
  description: 계정 삭제 알림 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 삭제 알림 팝업
- action: verify
  target: 삭제된 데이터는 되돌릴 수 없다는 안내 문구
  description: 계정 삭제의 복구 불가 안내를 확인한다.
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 계정 삭제 알림 팝업의 확인 문구 입력란
  description: 확인 문구 입력란에 포커스를 둔다.
  timeout: 10
  retry: 2
  params:
    expect_visible: Android 키보드
- action: input_text
  target: 계정 삭제 알림 팝업의 확인 문구 입력란
  description: 정확한 계정 삭제 확인 문구를 입력한다.
  timeout: 10
  retry: 1
  params:
    text: '{{consent_text}}'
- action: find_and_tap
  target: 계정 삭제 알림 팝업의 계정 삭제 버튼
  description: 계정 삭제를 확정한다.
  timeout: 25
  retry: 2
  params:
    expect_visible: Guest login 버튼
    wait_seconds: 7
- action: find_and_tap
  target: Guest login 버튼
  description: 계정 삭제 후 새로운 Guest 로그인을 시작한다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 게스트 로그인 데이터 유실 안내 팝업
- action: find_and_tap
  target: 게스트 로그인 데이터 유실 안내 팝업의 예 버튼
  description: Guest 로그인을 진행한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 튜토리얼 화면 또는 건너뛰기 버튼
    wait_seconds: 8
- action: verify
  target: 튜토리얼 시작 화면 또는 튜토리얼 건너뛰기 버튼
  description: 삭제된 데이터가 복구되지 않고 튜토리얼부터 시작하는지 확인한다.
  timeout: 20
  retry: 3
preconditions:
- 삭제 후 복구할 필요가 없는 테스트 계정으로 로그인되어 있어야 한다.
- 성공 시 계정 데이터가 삭제되는 파괴적 테스트다.
expected_results:
- 정확한 확인 문구 입력 후 계정 삭제 시 타이틀 화면으로 돌아가야 한다.
- 이후 Guest 로그인 시 이전 데이터가 사라지고 튜토리얼부터 시작해야 한다.
