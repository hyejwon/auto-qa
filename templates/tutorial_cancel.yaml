title: 튜토리얼 (취소 후 재실행)
description: 앱 실행 → 다운로드 취소 → 앱 종료 → 재실행 → 확인 → 튜토리얼 → 스킵 → 로비
package: com.percent.aos.rollinghero
steps:
- action: launch_app
  target: null
  params:
    package: com.percent.aos.rollinghero
  description: 앱을 최초로 실행한다.
  timeout: 30
  retry: 3
- action: verify
  target: 데이터 다운로드 추가 패치 진행 여부 팝업
  params: {}
  description: 데이터 다운로드 추가 패치 진행 여부 팝업이 등장하는지 확인한다.
  timeout: 15
  retry: 3
- action: find_and_tap
  target: 취소 버튼
  params:
    wait_seconds: 3
  description: 취소를 누르면 앱이 강제로 종료된다.
  timeout: 10
  retry: 2
- action: wait
  target: null
  params:
    seconds: 3
  description: 앱 종료 후 대기
  timeout: 10
  retry: 0
- action: launch_app
  target: null
  params:
    package: com.percent.aos.rollinghero
  description: 앱을 다시 실행한다.
  timeout: 30
  retry: 3
- action: verify
  target: 데이터 다운로드 추가 패치 진행 여부 팝업
  params: {}
  description: 데이터 다운로드 추가 패치 팝업이 다시 등장하는지 확인한다.
  timeout: 15
  retry: 3
- action: find_and_tap
  target: 확인 버튼
  params:
    expect_visible: 튜토리얼 화면
    expect_hidden: 데이터 다운로드 추가 패치 팝업
    wait_seconds: 10
    verify_timeout_sec: 20.0
  description: 확인 버튼을 눌러 다운로드 후 튜토리얼 진입을 대기한다.
  timeout: 60
  retry: 2
- action: skip_tutorial
  target: null
  params: {}
  description: 튜토리얼 스킵(치트)을 실행한다.
  timeout: 10
  retry: 3
- action: wait
  target: null
  params:
    seconds: 5
  description: 스킵 적용 및 화면 전환 대기
  timeout: 10
  retry: 0
- action: verify
  target: 로비 화면
  params: {}
  description: 튜토리얼 스킵 후 로비 화면으로 이동했는지 확인한다.
  timeout: 10
  retry: 3
expected_results:
- 취소 클릭 시 앱이 종료되어야 한다.
- 재실행 시 다운로드 팝업이 다시 노출되어야 한다.
- 확인 후 튜토리얼 진입 및 스킵이 정상 작동해야 한다.
