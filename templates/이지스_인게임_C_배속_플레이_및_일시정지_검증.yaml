title: 이지스 인게임 C 배속 플레이 및 게임 일시정지 검증
description: >
  전투 중 배속 조작과 일시정지 기능을 검증한다.
  실기기 확인 사실(2026-07-27):
  - 배속 버튼(우측 중하단 ▶▶)은 준비 화면에서는 배율 표기가 없고, 전투 중 1회 탭하면
    버튼 위에 "1.5x"가 표시된다.
  - 5배속 상품 미보유 상태에서는 1x ↔ 1.5x 두 단계만 순환한다. 기본 배속(1x)에서는 배율
    텍스트가 아예 표시되지 않아 read_text로는 읽을 수 없다 — 2회차 탭 결과는 "표기가 사라진
    기본 상태"로 판정한다.
  - 배속 조작은 v2 프로퍼티 `debug.time_scale`에도 반영된다(choiceable-float, 안쪽 value로 판정).
  - 일시정지 팝업 = 제목 "일시정지" + 음악/효과음 슬라이더 + 진동 토글 + [포기하기][계속하기].
  - 계속하기 → 팝업이 닫히고 전투가 그대로 이어진다.
  - 포기하기 → 곧바로 결과가 아니라 "주의 — 게임에서 나가면 현재까지 획득한 보상을 모두
    잃습니다." 확인 팝업([취소][확인])이 한 번 더 뜬다. 확인해야 결과 화면으로 넘어간다.
  ⚠️ 검증(read_screen 등)에 시간이 걸리는 사이 패배해 전투가 끝나면 이후 스텝이 무너지므로
  무적 프로퍼티를 켜고 진행한 뒤 인게임을 떠나기 전에 되돌린다.
package: com.supermagic.aos.aegisdefense
steps:
- action: close_app
  target: com.supermagic.aos.aegisdefense
  description: 이전 실행 상태를 완전히 끊기 위해 앱 종료
  timeout: 15
  retry: 2
  params:
    package: com.supermagic.aos.aegisdefense
- action: launch_app
  target: com.supermagic.aos.aegisdefense
  description: 이지스 디펜스 실행
  timeout: 30
  retry: 2
  params:
    package: com.supermagic.aos.aegisdefense
- action: wait
  description: AEGIS 스플래시 로딩 대기 (실기기 60~80초)
  timeout: 90
  retry: 1
  params:
    seconds: 60
# ⚠️ 패치 데이터가 있으면 스플래시 도중 "추가 데이터 다운로드" 팝업이 떠서 로딩이 멈춘다
# ([종료하기][다운로드], 2026-07-27 실기기 확인). 뜬 경우에만 다운로드를 눌러 통과시키고,
# 그 뒤 추가 로딩 시간을 준다 — 안 떴으면 플래그가 없어 대기 스텝도 건너뛴다.
- action: find_and_tap
  target: 추가 데이터 다운로드 제목이 붙은 팝업 하단 오른쪽 검은색 다운로드 버튼
  description: 추가 데이터 다운로드 팝업이 뜨면 다운로드 진행
  timeout: 20
  retry: 1
  params:
    optional: true
    set_flag_on_pass: patch_download
    wait_seconds: 5
- action: wait
  description: (다운로드를 진행했을 때만) 패치 적용 후 재로딩 대기
  timeout: 120
  retry: 1
  params:
    run_if_flag: patch_download
    seconds: 75
- action: find_and_tap
  target: 이어하기 제목이 붙은 팝업 하단 왼쪽 회색 취소 버튼
  description: 이어하기 팝업이 뜨면 취소
  timeout: 15
  retry: 1
  params:
    optional: true
    wait_seconds: 3
# ⚠️ 타깃을 "가운데 아래 검은 둥근 버튼"처럼 두루뭉술하게 쓰면 아웃게임의 "전투" 버튼을
# 눌러 스테이지에 들어가 버린다(2026-07-27 실기기에서 실제로 발생). 반드시 팝업 상자 안에
# 있고 글자가 "확인"인 버튼으로 한정한다.
- action: find_and_tap
  target: 화면 가운데 떠 있는 회색 팝업 상자 안에서 "확인"이라고 적힌 검은색 둥근 버튼 (팝업이 없거나 버튼 글자가 "전투"·"다음"이면 대상 아님)
  description: 결과·안내 팝업이 남아 있으면 닫기
  timeout: 15
  retry: 1
  params:
    optional: true
    wait_seconds: 3
# 씬 판정은 Vision이 아니라 앱 내부 치트 목록 접두사로 한다 — 호출 0회, 오탐 없음.
# 로딩 중이면 씬 치트가 아예 없어 실패하므로 로딩 완료 확인도 겸한다.
- action: verify
  target: 아웃게임 스테이지 선택 화면 (씬 판정으로 확인)
  description: 아웃게임 진입 확인
  timeout: 60
  retry: 5
  params:
    scene: outgame
# 5배속 상품 상태는 공용(common) 프로퍼티라 아웃게임에서도 읽을 수 있다.
- action: check_property
  target: common.product.five_x_speed
  description: 배속 순환 단계 기준 확인 — 5배속 상품 미보유(false)를 전제로 판정한다
  timeout: 20
  retry: 2
  params:
    label: 5배속 상품
    expect_value: false
- action: call_cheat
  target: common.stage.start
  description: 1-1 스테이지를 웨이브 1부터 시작 — 인게임 진입
  timeout: 20
  retry: 2
  params:
    args:
      chapterId: 1
      stageInChapter: 1
    wait_seconds: 8
- action: verify
  target: 상단에 Wave 1 진행 표시가 있고 하단에 이지스 소환 버튼과 검은색 둥근 전투 시작 버튼이 보이는 인게임 준비 화면
  description: 인게임 준비 화면 진입 확인
  timeout: 40
  retry: 4
  params: {}
# ── 배속: 준비 화면에서는 표기 없음 ────────────────────────────
- action: verify
  target: 화면 오른쪽 중하단에 원형 테두리 안 이중 삼각형(▶▶) 배속 버튼이 배율 숫자 표기 없이 보이는 상태
  description: 준비 화면에서는 배속 버튼에 배율 표기가 없음을 확인
  timeout: 30
  retry: 3
  params: {}
- action: set_property
  target: ingame.player.invincible_state
  description: 검증 도중 패배로 전투가 끊기지 않도록 무적 켜기
  timeout: 20
  retry: 2
  params:
    value: true
- action: find_and_tap
  target: 화면 하단 가운데 이지스 소환 버튼
  description: 전투 진행을 위해 이지스 1기 배치
  timeout: 20
  retry: 2
  params:
    wait_seconds: 2
- action: find_and_tap
  target: 화면 최하단 검은색 둥근 전투 시작 버튼
  description: 전투 시작
  timeout: 20
  retry: 2
  params:
    wait_seconds: 5
- action: verify
  target: 하단에 이지스 아이콘과 처치 수가 적힌 킬 스코어 목록이 보이는 전투 진행 화면
  description: 전투 진행 상태 확인
  timeout: 30
  retry: 3
  params: {}
# ── 배속 순환 검증 ────────────────────────────────────────────
- action: check_property
  target: debug.time_scale
  description: 전투 시작 시점 배속 기록 (기본 1.0)
  timeout: 20
  retry: 2
  params:
    label: 게임 배속
    save_as: time_scale_base
- action: find_and_tap
  target: 화면 오른쪽 중하단 원형 테두리 안 이중 삼각형 배속 버튼
  description: 배속 1회 상향
  timeout: 20
  retry: 2
  params:
    wait_seconds: 2
- action: read_text
  target: 배속 버튼 위쪽에 표시된 현재 배율 텍스트 (예 1.5x)
  description: 배속 표기 확인 (실기기 1회 탭 기준 1.5x)
  timeout: 30
  retry: 3
  params:
    save_as: speed_step1
- action: check_property
  target: debug.time_scale
  description: 배속 버튼 조작이 debug.time_scale 프로퍼티에 반영되는지 검증
  timeout: 20
  retry: 2
  params:
    label: 게임 배속
    compare_with: time_scale_base
    expect_increase: true
- action: verify
  target: 배속이 올라간 상태에서도 상단 웨이브 표시와 하단 킬 스코어 목록이 그대로 있고 적이 계속 움직이는 전투 진행 화면
  description: 배속 플레이 중에도 전투가 정상 진행되는지 확인
  timeout: 30
  retry: 3
  params: {}
- action: find_and_tap
  target: 화면 오른쪽 중하단 원형 테두리 안 배율 숫자가 표시된 배속 버튼
  description: 배속 2회차 탭 — 미해금 상태에서는 기본 배속으로 순환해 돌아온다
  timeout: 20
  retry: 2
  params:
    wait_seconds: 2
- action: verify
  target: 화면 오른쪽 중하단 배속 버튼에 1.5x 같은 배율 숫자 표기가 없어진 기본 배속 상태
  description: 2회차 탭 후 기본 배속(1x)으로 순환 복귀했는지 검증
  timeout: 30
  retry: 3
  params: {}
- action: check_property
  target: debug.time_scale
  description: 프로퍼티 값도 기본 배속으로 돌아왔는지 검증
  timeout: 20
  retry: 2
  params:
    label: 게임 배속
    compare_with: time_scale_base
    expect_changed: false
# ── 일시정지: 계속하기 ────────────────────────────────────────
- action: find_and_tap
  target: 화면 우측 상단 원형 일시정지 버튼
  description: 전투 중 일시정지
  timeout: 20
  retry: 2
  params:
    expect_visible: 일시정지 제목이 붙은 팝업
    wait_seconds: 2
- action: read_screen
  description: 일시정지 팝업 구성요소 일괄 확인
  timeout: 60
  retry: 2
  params:
    items:
    - name: 팝업 제목
      description: 팝업 상단 가운데 "일시정지" 제목 텍스트
    - name: 음악 슬라이더
      description: 팝업 안 음표 아이콘과 함께 있는 "음악" 볼륨 슬라이더 — 존재 여부만 확인
    - name: 효과음 슬라이더
      description: 팝업 안 스피커 아이콘과 함께 있는 "효과음" 볼륨 슬라이더 — 존재 여부만 확인
    - name: 진동 토글
      description: 팝업 안 "진동" 라벨 옆의 on/off 토글 스위치 — 존재 여부만 확인
    - name: 포기하기 버튼
      description: 팝업 하단 왼쪽 회색 "포기하기" 버튼 — 존재 여부만 확인
    - name: 계속하기 버튼
      description: 팝업 하단 오른쪽 검은색 "계속하기" 버튼 — 존재 여부만 확인
- action: find_and_tap
  target: 일시정지 팝업 하단 오른쪽 검은색 계속하기 버튼
  description: 계속하기 — 팝업이 닫히고 전투가 이어져야 한다
  timeout: 20
  retry: 2
  params:
    expect_hidden: 일시정지 제목이 붙은 팝업
    wait_seconds: 2
- action: verify
  target: 팝업과 딤 오버레이가 사라지고 상단 웨이브 표시와 하단 킬 스코어 목록이 보이는 전투 진행 화면
  description: 계속하기 후 전투가 정상 재개되는지 확인
  timeout: 30
  retry: 3
  params: {}
# ── 일시정지: 포기하기 ────────────────────────────────────────
- action: find_and_tap
  target: 화면 우측 상단 원형 일시정지 버튼
  description: 다시 일시정지 — 이번엔 포기하기 경로 검증
  timeout: 20
  retry: 2
  params:
    expect_visible: 일시정지 제목이 붙은 팝업
    wait_seconds: 2
- action: set_property
  target: ingame.player.invincible_state
  description: 무적 원상 복구 (인게임 씬을 떠나기 전에 되돌린다)
  timeout: 20
  retry: 2
  params:
    value: false
- action: find_and_tap
  target: 일시정지 팝업 하단 왼쪽 회색 포기하기 버튼
  description: 포기하기 — 보상 손실 경고 팝업이 먼저 떠야 한다
  timeout: 20
  retry: 2
  params:
    expect_visible: 주의 라는 제목과 게임에서 나가면 현재까지 획득한 보상을 모두 잃습니다 문구가 있고 취소·확인 버튼이 있는 팝업
    wait_seconds: 3
- action: find_and_tap
  target: 주의 팝업 하단 오른쪽 검은색 둥근 확인 버튼
  description: 보상 손실 경고에서 확인 — 전투가 종료된다
  timeout: 20
  retry: 2
  params:
    wait_seconds: 6
# 포기 후 화면은 결과 팝업이 뜨거나 바로 아웃게임으로 돌아간다 — 둘 다 정상 종료로 본다.
- action: find_and_tap
  target: 결과 팝업 하단 검은색 둥근 확인 버튼
  description: 결과 팝업이 뜬 경우 확인 (안 뜨면 건너뜀)
  timeout: 20
  retry: 1
  params:
    optional: true
    wait_seconds: 5
- action: verify
  target: 상단에 스테이지 번호와 행성 이름, 하단에 다음 또는 전투 버튼과 상점 카트 아이콘이 보이는 아웃게임 스테이지 선택 화면
  description: 포기 후 아웃게임 복귀 확인
  timeout: 60
  retry: 4
  params: {}
preconditions:
- 이지스 디펜스 디버그 빌드가 설치되어 있고 앱 내부 v2 치트 서버(37772)가 떠 있어야 한다
- 5배속 상품을 보유하지 않은 계정이어야 한다 (배속 순환 단계 기준)
expected_results:
- 준비 화면에서는 배속 버튼에 배율 표기가 없다
- 전투 중 배속 버튼을 누르면 1.5x가 표기되고 debug.time_scale 값도 함께 올라간다
- 다시 누르면 기본 배속으로 순환 복귀하고 프로퍼티 값도 원래대로 돌아온다
- 배속 변경 중에도 전투가 끊기지 않는다
- 일시정지 팝업에 음악·효과음·진동 설정과 포기하기/계속하기 버튼이 모두 표시된다
- 계속하기는 전투를 그대로 재개하고, 포기하기는 보상 손실 경고를 거쳐 아웃게임으로 복귀시킨다
