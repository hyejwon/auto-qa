title: Google 로그인 (직접)
description: 앱 실행 → Google 로그인 버튼 → 약관 동의 → 계정 선택 → 튜토리얼 진입
package: com.percent.aos.cooptd
steps:
- action: launch_app
  target: null
  params:
    package: com.percent.aos.cooptd
  description: 앱을 실행한다.
  timeout: 30
  retry: 3
- action: find_and_tap
  target: Google 로그인 버튼
  params:
    expect_visible: 약관 알림 팝업
  description: Google 로그인 버튼을 클릭한다.
  timeout: 15
  retry: 2
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  params:
    expect_visible: 계정 선택 팝업
  description: 약관 알림 팝업 내 동의합니다 영역을 터치한다.
  timeout: 10
  retry: 2
- action: verify
  target: qa_google_01@111percnet.net
  params: {}
  description: qa_google_01@111percnet.net 계정이 연동되어 있는지 확인한다.
  timeout: 10
  retry: 2
- action: find_and_tap
  target: qa_google_01@111percnet.net
  params:
    expect_hidden: 계정 선택 팝업
    wait_seconds: 5
  description: qa_google_01@111percnet.net 계정을 선택한다.
  timeout: 20
  retry: 2
- action: verify
  target: 튜토리얼 화면
  params: {}
  description: 로그인 성공 후 튜토리얼 화면으로 이동했는지 확인한다.
  timeout: 30
  retry: 3
expected_results:
- 약관 알림 팝업이 정상 출력되어야 한다.
- 계정 선택 팝업에서 대상 계정이 확인되어야 한다.
- 로그인 성공 후 튜토리얼 화면으로 이동해야 한다.
