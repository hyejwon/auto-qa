title: 협타디 튜토리얼 스킵 및 컨텐츠 해금 흐름 테스트
description: ''
package: com.percent.aos.cooptd
steps:
- action: skip_tutorial
  target: com.percent.aos.cooptd
  description: 튜토리얼 스킵 API 호출
  timeout: 20
  retry: 2
- action: close_app
  target: com.percent.aos.cooptd
  description: 재부팅을 위한 앱 종료
  timeout: 10
  retry: 2
- action: launch_app
  target: com.percent.aos.cooptd
  description: 앱 재실행
  timeout: 20
  retry: 2
- action: find_and_tap
  target: 건너뛰기 버튼
  description: 튜토리얼 건너뛰기 버튼 클릭
  timeout: 10
  retry: 2
  params:
    expect_visible: 정말로 건너뛰시겠습니까 팝업
- action: find_and_tap
  target: 예 버튼
  description: 건너뛰기 확인 팝업에서 예 클릭
  timeout: 10
  retry: 2
  params:
    expect_hidden: 정말로 건너뛰시겠습니까 팝업
    wait_seconds: 1
- action: dismiss_popups
  description: VIP 상점의 좌측 하단 뒤로가기 버튼을 누르고 반복되는 컨텐츠 해금 안내 닫기
  timeout: 120
  retry: 1
  params:
    stop_when_visible: 우측 상단 햄버거 메뉴 버튼
    max_count: 4
    timeout_seconds: 120
    initial_wait_seconds: 1
    quiet_seconds: 0
    rules:
    - target: VIP 상점 좌측 하단 뒤로가기 버튼
      action: tap
    - target: 새로운 컨텐츠가 해금되었어요 팝업
      action: tap_center
preconditions: []
