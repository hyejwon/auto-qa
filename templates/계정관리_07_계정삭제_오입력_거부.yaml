title: 계정관리 07 - 계정 삭제 확인 문구 오입력 거부
description: 계정 삭제 알림 팝업에 잘못된 확인 문구를 입력했을 때 삭제가 거부되는지 확인한다.
package: com.percent.aos.cooptd
required_tab: 전투
parameters:
- name: invalid_consent_text
  label: 잘못된 확인 문구
  description: 동의합니다와 일치하지 않아야 하는 문자열
  example: 동의하지않습니다
  default: 동의하지않습니다
steps:
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 햄버거 메뉴를 연다.
  timeout: 15
  retry: 3
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: find_and_tap
  target: 설정 팝업 하단 우측의 계정 연동 또는 연결됨 버튼
  description: 계정 연동/관리 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 연동 팝업
- action: find_and_tap
  target: 계정 연동 팝업 내 계정 삭제 버튼
  description: 계정 삭제 알림 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 삭제 알림 팝업
- action: verify
  target: 계정 삭제 알림 팝업의 '동의합니다' 입력 안내 문구
  description: 계정 삭제 확인 문구 입력 요구를 확인한다.
  timeout: 10
  retry: 2
- action: find_and_tap
  target: 계정 삭제 알림 팝업의 확인 문구 입력란
  description: 확인 문구 입력란에 포커스를 둔다.
  timeout: 10
  retry: 2
  params:
    expect_visible: Android 키보드
- action: input_text
  target: 계정 삭제 알림 팝업의 확인 문구 입력란
  description: 동의합니다와 다른 문구를 입력한다.
  timeout: 10
  retry: 1
  params:
    text: '{{invalid_consent_text}}'
- action: find_and_tap
  target: 계정 삭제 알림 팝업의 계정 삭제 버튼
  description: 잘못된 확인 문구로 계정 삭제를 시도한다.
  timeout: 10
  retry: 2
  params:
    expect_visible: 입력 문구가 일치하지 않는다는 토스트 메시지
- action: verify
  target: 계정 삭제 알림 팝업
  description: 삭제 실패 후 알림 팝업이 유지되는지 확인한다.
  timeout: 10
  retry: 2
preconditions:
- 삭제할 테스트 계정으로 로그인되어 있어야 한다.
expected_results:
- 잘못된 확인 문구 입력 시 불일치 토스트가 출력되어야 한다.
- 계정 삭제가 수행되지 않고 계정 삭제 알림 팝업이 유지되어야 한다.
