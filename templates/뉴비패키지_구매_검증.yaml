title: 뉴비패키지 구매 검증
description: >
  상점 진입 → 뉴비패키지 5500 KRW 상품 선택 → Google Play 결제 → 구매 후 보유 다이아 변경 확인.
  ⚠️ 뉴비패키지는 계정당 1회 한정 상품이라 이미 구매한 계정에서는 재실행 불가 —
  신규(미구매) 테스트 계정으로만 돌릴 것.
package: ''
steps:
# 1) 메인 화면 또는 하단 내비게이션에서 상점으로 진입한다.
- action: find_and_tap
  target: 하단 상점 탭
  params:
    expect_visible: 뉴비패키지
    wait_seconds: 2
  description: 상점 진입 및 뉴비패키지 노출 확인
  timeout: 20
  retry: 2

# 2) 구매 전 보유 다이아 수량을 저장한다.
- action: read_text
  target: 상단 보유 다이아 수량
  params:
    save_as: diamond_before
  description: 구매 전 보유 다이아 수량 저장
  timeout: 10
  retry: 2

# 3) 뉴비패키지 5500 KRW 가격 버튼을 탭해 Google Play 결제 시트를 연다.
- action: find_and_tap
  target: 뉴비패키지 5500 KRW 가격 버튼
  params:
    expect_visible: Google Play 원탭 구매 버튼
    wait_seconds: 4
  description: 뉴비패키지 상품 선택 및 Google Play 결제 시트 확인
  timeout: 30
  retry: 2

# 4) Google Play 결제 시트에서 원탭 구매를 진행한다. 결제 완료 후 다음 화면은
#    구매 인증 팝업 / 바로 획득 화면 두 갈래라서 여기서는 화면 검증을 하지 않는다.
- action: find_and_tap
  target: Google Play 원탭 구매 버튼
  params:
    wait_seconds: 8
  description: 원탭 구매 버튼 탭 및 결제 완료 대기
  timeout: 45
  retry: 2

# 4-1) [조건부] Google Play 결제 완료 확인 화면이 나오면 닫는다. 안 나오면 건너뜀.
- action: find_and_tap
  target: Google Play 결제 완료 화면의 확인 버튼
  params:
    optional: true
    wait_seconds: 2
  description: (나올 경우) Google Play 결제 완료 확인 닫기
  timeout: 12
  retry: 1

# 4-2) [조건부] 구매 인증 팝업이 나오면 '요구 안함' 선택 → '확인' 버튼까지 한 스텝(then_tap).
#    안 나오면 스텝 전체를 건너뛴다. '요구 안함'을 선택해야 다음 결제부터 인증 없이
#    진행되어 자동화 친화적 상태가 유지된다.
- action: find_and_tap
  target: 구매 인증 팝업의 '요구 안함' 옵션 버튼
  params:
    optional: true
    then_tap: 구매 인증 팝업의 '확인' 버튼
    wait_seconds: 3
  description: (나올 경우) 구매 인증 팝업에서 '요구 안함' 선택 후 확인
  timeout: 15
  retry: 1

# 5) 뉴비패키지는 상점에 뜨는 '첫 결제 보너스! 초마신 검귀 100% 증정!' 배너가 붙은
#    첫 결제 전용 상품이라 팝업이 항상 3개(재화 획득 → 초마신전용 유물 획득 →
#    검귀(초마신) 획득) 연속으로 뜬다(2026-07-22 실기기 확인, 뉴비패키지_최초결제_검귀획득
#    _검증.yaml 참고). 검귀 획득 화면 자체를 검증하려면 그 템플릿을 쓰고, 이 템플릿은
#    재화 지급 여부만 빠르게 확인하는 것이 목적이므로 몇 개가 뜨든 상점 화면(다이아 수량
#    노출)이 보일 때까지 반복해서 닫는다.
- action: dismiss_popups
  params:
    stop_when_visible: 상단 보유 다이아 수량
    max_count: 4
    timeout_seconds: 40
    quiet_seconds: 1.5
    rules:
    - target: 아이템 획득 팝업의 안내 문구 ('터치하세요' 또는 '계속하려면 화면을 눌러주세요')
      action: tap
  description: 획득 팝업 3개(첫 결제 특전) 정리 후 상점 복귀
  timeout: 45
  retry: 1

# 6) 구매 후 보유 다이아 수량이 구매 전과 달라졌는지 확인한다.
- action: read_text
  target: 상단 보유 다이아 수량
  params:
    compare_with: diamond_before
    expect_changed: true
  description: 구매 후 보유 다이아 수량 변경 확인
  timeout: 10
  retry: 2

expected_results:
- 상점 화면에서 뉴비패키지가 노출되어야 한다.
- 뉴비패키지 5500 KRW 가격 버튼 탭 후 Google Play 결제 시트가 노출되어야 한다.
- 원탭 구매 후 구매 완료 상태가 확인되어야 한다.
- 구매 후 상단 보유 다이아 수량이 구매 전과 달라져야 한다.
- 뉴비패키지는 계정당 1회 한정이므로 반드시 미구매 신규 계정에서 실행해야 한다.
