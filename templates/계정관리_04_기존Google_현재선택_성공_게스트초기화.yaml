title: 계정관리 04 - 기존 Google 현재 데이터 선택 성공 및 게스트 초기화
description: 기존 데이터가 있는 Google 계정에 현재 게스트 데이터를 덮어쓰고, 로그아웃 후 새 Guest 로그인 시 기존 게스트 데이터가 사라졌는지 확인한다.
package: com.percent.aos.cooptd
required_tab: 전투
parameters:
- name: google_account_with_data
  label: 기존 데이터가 있는 Google 계정
  description: 이미 게임 데이터가 연결된 Google 계정 이메일
  example: qa_google_01@111percent.net
  default: qa_google_01@111percent.net
- name: consent_text
  label: 계정 소실 확인 문구
  description: 계정 소실 알림 팝업이 요구하는 정확한 문자열
  example: 동의합니다
  default: 동의합니다
steps:
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 햄버거 메뉴를 연다.
  timeout: 15
  retry: 3
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 현재 게스트 PID를 저장한다.
  timeout: 15
  retry: 2
  params:
    save_as: guest_pid_before
- action: find_and_tap
  target: 설정 팝업 하단 우측의 계정 연동 버튼
  description: 계정 연동 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 연동 팝업
- action: find_and_tap
  target: 계정 연동 팝업 내 Google 로그인 버튼
  description: 기존 데이터가 있는 Google 계정 로그인을 시작한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Google 계정 선택 화면 또는 약관 알림 팝업
- action: find_and_tap
  target: 약관 알림 팝업 내 동의합니다 영역
  description: 최초 연동일 때만 약관에 동의한다.
  timeout: 10
  retry: 1
  params:
    optional: true
    expect_visible: Google 계정 선택 화면
- action: find_and_tap
  target: '{{google_account_with_data}}'
  description: 기존 데이터가 있는 Google 계정을 선택한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 기존 데이터 / 현재 데이터 선택 팝업
    wait_seconds: 3
- action: find_and_tap
  target: 현재 데이터 버튼
  description: 현재 게스트 데이터로 Google 계정 데이터를 교체하는 분기를 선택한다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 계정 소실 알림 팝업
- action: find_and_tap
  target: 계정 소실 알림 팝업의 확인 문구 입력란
  description: 확인 문구 입력란에 포커스를 둔다.
  timeout: 10
  retry: 2
  params:
    expect_visible: Android 키보드
- action: input_text
  target: 계정 소실 알림 팝업의 확인 문구 입력란
  description: 정확한 계정 소실 확인 문구를 입력한다.
  timeout: 10
  retry: 1
  params:
    text: '{{consent_text}}'
- action: find_and_tap
  target: 계정 소실 알림 팝업의 계정 연동 버튼
  description: 현재 게스트 데이터로 계정 연동을 확정한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 우측 상단 햄버거 메뉴(☰) 버튼
    wait_seconds: 5
- action: find_and_tap
  target: 우측 상단 햄버거 메뉴(☰) 버튼
  description: 연동 후 PID 확인을 위해 햄버거 메뉴를 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 톱니바퀴 모양 설정 버튼
- action: find_and_tap
  target: 톱니바퀴 모양 설정 버튼
  description: 설정 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 설정 팝업
- action: read_text
  target: 설정 팝업 상단 Version 아래 UID/PID 값(복사 버튼 왼쪽 영문·숫자 문자열)
  description: 연동된 Google 계정이 기존 게스트 PID를 사용하는지 확인한다.
  timeout: 15
  retry: 2
  params:
    compare_with: guest_pid_before
    expect_changed: false
- action: find_and_tap
  target: 초록색 '연결됨' 버튼 (설정 팝업 하단 우측)
  description: 계정 관리 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 버튼
- action: find_and_tap
  target: 로그아웃 버튼
  description: 로그아웃 알림 팝업을 연다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 로그아웃 알림 팝업
- action: find_and_tap
  target: 로그아웃 알림 팝업의 로그아웃 버튼
  description: 로그아웃하고 타이틀 화면으로 돌아간다.
  timeout: 20
  retry: 2
  params:
    expect_visible: Guest login 버튼
    wait_seconds: 5
- action: find_and_tap
  target: Guest login 버튼
  description: 새로운 Guest 로그인을 시작한다.
  timeout: 15
  retry: 2
  params:
    expect_visible: 게스트 로그인 데이터 유실 안내 팝업
- action: find_and_tap
  target: 게스트 로그인 데이터 유실 안내 팝업의 예 버튼
  description: Guest 로그인을 진행한다.
  timeout: 20
  retry: 2
  params:
    expect_visible: 튜토리얼 화면 또는 건너뛰기 버튼
    wait_seconds: 8
- action: verify
  target: 튜토리얼 시작 화면 또는 튜토리얼 건너뛰기 버튼
  description: 이전 게스트 데이터가 사라지고 튜토리얼부터 시작하는지 확인한다.
  timeout: 20
  retry: 3
preconditions:
- Guest 로그인 상태여야 한다.
- google_account_with_data에는 기존 게임 데이터가 연결되어 있어야 한다.
- 실행 성공 시 Google 계정의 기존 데이터와 로컬 게스트 데이터가 변경되는 파괴적 테스트다.
expected_results:
- 현재 데이터 선택 후 정확한 확인 문구 입력 시 계정 연동에 성공해야 한다.
- 연동된 Google 계정 PID는 연동 전 게스트 PID와 같아야 한다.
- 로그아웃 후 새 Guest 로그인 시 이전 게스트 데이터가 사라지고 튜토리얼부터 시작해야 한다.
