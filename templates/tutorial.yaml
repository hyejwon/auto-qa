title: 튜토리얼 스킵
description: 앱 최초 실행 → 데이터 다운로드 → 튜토리얼 스킵 → 로비 진입
package: com.percent.aos.rollinghero
steps:
- action: launch_app
  target: null
  params:
    package: com.percent.aos.rollinghero
  description: 앱을 실행합니다.
  timeout: 30
  retry: 3
- action: verify
  target: 데이터 다운로드 추가 패치 진행 여부 팝업
  params: {}
  description: 데이터 다운로드 팝업이 노출되는지 확인합니다.
  timeout: 15
  retry: 3
- action: find_and_tap
  target: 확인 버튼
  params:
    expect_visible: 튜토리얼 화면
    expect_hidden: 데이터 다운로드 추가 패치 팝업
    wait_seconds: 10
  description: 확인 버튼을 눌러 다운로드 후 튜토리얼 진입을 대기합니다.
  timeout: 60
  retry: 2
- action: skip_tutorial
  target: null
  params: {}
  description: 튜토리얼 스킵(치트)을 실행합니다.
  timeout: 10
  retry: 3
- action: wait
  target: null
  params:
    seconds: 5
  description: 스킵 적용 및 화면 전환 대기
  timeout: 10
  retry: 0
- action: verify
  target: 로비 화면
  params: {}
  description: 로비(메인) 화면으로 진입했는지 검증합니다.
  timeout: 10
  retry: 3
expected_results:
- 데이터 다운로드 팝업이 정상 노출되어야 한다.
- 튜토리얼 스킵 후 로비 화면으로 진입해야 한다.
