name: Build Agent EXE (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'agent_server.py'
      - 'config.py'
      - 'adb_controller.py'
      - 'qa_orchestrator.py'
      - 'vision_agent.py'
      - 'planner_node.py'
      - 'unity_api_client.py'
      - 'eval_agent.py'
      - 'llm_client.py'
      - 'test_manager.py'
      - 'element_cache.py'
      - 'requirements.txt'
      - 'frontend/**'

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --name qa-auto `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "templates;templates" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --collect-all google-genai `
            --copy-metadata google-genai `
            --hidden-import langfuse `
            agent_server.py

      - name: Get version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create release zip
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\qa-auto.exe release\
          Copy-Item .env.agent.example release\.env.example
          Copy-Item package_apk_map.json release\package_apk_map.json
          Compress-Archive -Path release\* -DestinationPath qa-auto-agent-${{ steps.version.outputs.sha }}.zip

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-${{ steps.version.outputs.sha }}
          name: "qa-auto Agent (${{ steps.version.outputs.sha }})"
          body: |
            ## 설치 방법
            1. `qa-auto-agent-*.zip` 다운로드 후 압축 해제
            2. `.env.example` → `.env` 복사 후 설정 입력
            3. `qa-auto.exe` 실행
          files: qa-auto-agent-${{ steps.version.outputs.sha }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
