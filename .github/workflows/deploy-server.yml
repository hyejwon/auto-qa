name: Deploy Orchestrator (Linux Server)

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator_server.py'
      - 'config.py'
      - 'planner_node.py'
      - 'llm_client.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker image
        run: |
          docker build -t qa-auto-orchestrator:latest .
          docker save qa-auto-orchestrator:latest | gzip > qa-auto-orchestrator.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: qa-auto-orchestrator.tar.gz
          target: /opt/qa-auto/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/qa-auto
            docker load < qa-auto-orchestrator.tar.gz
            docker compose up -d --no-build
            docker image prune -f
            echo "✅ 배포 완료: $(date)"
